<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>สุ่มโจทย์หา ห.ร.ม.</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<style>

  /* =========================================================
     1. BASE / VARIABLES
     ========================================================= */
  :root {
    --navy: #EAF4FF;
    --navy-deep: #315B92;
    --coral: #DF655D;
    --coral-deep: #C84D47;
    --gold: #315B92;
    --ink: #192E43;
    --muted: #52677C;
    --panel: #FFFFFF;
    --border: #C5D9EC;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { margin: 0; overflow: hidden; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", "Noto Sans Thai", sans-serif;
    background: var(--navy);
    color: var(--ink);
    height: 100dvh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
    position: relative;
  }

  /* =========================================================
     2. BACKGROUND DECORATION
     ========================================================= */
  .blob { position: absolute; border-radius: 50%; pointer-events: none; }
  .blob-1 { width: 38vmax; height: 38vmax; background: var(--coral); opacity: 0.06; top: -14vmax; right: -12vmax; }
  .blob-2 { width: 26vmax; height: 26vmax; background: var(--gold); opacity: 0.05; bottom: -10vmax; left: -8vmax; }

  /* =========================================================
     3. HEADER (eyebrow) + GEAR BUTTON
     ========================================================= */
  .eyebrow {
    letter-spacing: 0.12em;
    font-size: clamp(13px, 1.6vw, 18px);
    font-weight: 700;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 8px;
    z-index: 1;
  }

  .gear-btn {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--panel);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    z-index: 2;
    padding: 0;
  }
  .gear-btn:active { background: #DCEBFA; }

  /* =========================================================
     4. STAGE (problem / answer area)
     ---- note: this exercise's answer (a division ladder that
     grows with the number count and their prime factors) can
     genuinely exceed viewport height on short mobile screens,
     so — unlike other exercises — the stage keeps its own
     padding + scroll as a deliberate exception. ----
     ========================================================= */
  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    flex: 1;
    width: 100%;
    max-width: 1000px;
    min-height: 0;
    z-index: 1;
    padding: 10px 20px;
    overflow-y: auto;
  }

  .expr {
    font-family: "Times New Roman", Times, serif;
    font-size: clamp(26px, 5.5vw, 48px);
    font-weight: 400;
    text-align: center;
    line-height: 1.35;
    letter-spacing: 0.05em;
    max-width: 100%;
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  .expr.swap { opacity: 0; transform: scale(0.95); }

  .answer-wrap { width: 100%; transition: opacity 0.15s ease, transform 0.15s ease; text-align: center; }
  .answer-wrap.swap { opacity: 0; transform: scale(0.95); }

  .mode-label {
    margin-top: 16px;
    font-size: clamp(13px, 1.8vw, 18px);
    color: var(--muted);
    text-align: center;
    z-index: 1;
  }

  /* ---- exercise-specific: short-division ladder ---- */
  .ladder {
    display: inline-block;
    border-collapse: collapse;
    font-family: "Times New Roman", Times, serif;
    font-size: clamp(18px, 3.4vw, 30px);
    font-weight: 400;
  }
  .ladder tr td { padding: 4px 14px; text-align: center; }
  .ladder .divcol {
    color: var(--coral);
    border-right: 2.5px solid var(--muted);
    padding-right: 12px;
  }

  .final-line {
    font-family: "Times New Roman", Times, serif;
    font-size: clamp(20px, 4vw, 36px);
    font-weight: 700;
    color: var(--gold);
    margin-top: 16px;
  }

  /* =========================================================
     5. MAIN CONTROLS (next / toggle / end)
     ========================================================= */
  .controls {
    display: flex;
    gap: 14px;
    width: 100%;
    max-width: 760px;
    padding: 8px 24px clamp(12px, 3vh, 30px);
    z-index: 1;
    flex-shrink: 0;
  }

  button {
    border: none;
    border-radius: 20px;
    font-family: inherit;
    font-weight: 400;
    cursor: pointer;
    -webkit-appearance: none;
    transition: transform 0.08s ease, filter 0.15s ease;
  }
  button:active { transform: scale(0.96); }

  .btn-next {
    flex: 2;
    background: var(--coral);
    color: #FFFFFF;
    font-size: clamp(13px, 1.9vw, 20px);
    padding: clamp(12px, 2.4vh, 20px) 10px;
    white-space: nowrap;
  }

  .btn-toggle {
    flex: 2;
    background: var(--navy-deep);
    color: #FFFFFF;
    border: 2px solid var(--navy-deep);
    font-size: clamp(13px, 1.9vw, 20px);
    padding: clamp(12px, 2.4vh, 20px) 16px;
  }

  .btn-end {
    flex: 1;
    background: transparent;
    color: var(--muted);
    border: 2px solid var(--border);
    font-size: clamp(13px, 1.9vw, 20px);
    padding: clamp(12px, 2.4vh, 20px) 12px;
  }
  .btn-end:active { background: var(--navy-deep); }

  /* =========================================================
     6. END SCREEN
     ========================================================= */
  .end-screen {
    position: fixed;
    inset: 0;
    background: var(--navy);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    z-index: 10;
  }
  .end-screen.show { display: flex; }
  .end-screen .headline { font-size: clamp(32px, 6vw, 56px); font-weight: 800; margin-bottom: 12px; }
  .end-screen .sub { color: var(--muted); font-size: clamp(16px, 2.4vw, 22px); margin-bottom: 36px; }

  .btn-restart {
    background: var(--navy-deep);
    color: #FFFFFF;
    font-size: clamp(17px, 2.4vw, 22px);
    padding: 18px 40px;
    border-radius: 20px;
  }

  /* =========================================================
     7. SETTINGS PANEL
     ========================================================= */
  .settings-overlay {
    position: fixed;
    inset: 0;
    background: rgba(25, 46, 67, 0.45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 20;
    padding: 20px;
    overflow-y: auto;
  }
  .settings-overlay.show { display: flex; }

  .settings-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 28px 24px;
    width: 100%;
    max-width: 420px;
    max-height: 92vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(25, 46, 67, 0.18);
  }
  .settings-panel h2 { margin: 0 0 4px; font-size: 20px; font-weight: 800; }
  .settings-panel .desc { color: var(--muted); font-size: 13px; margin-bottom: 18px; }

  .field-group { margin-bottom: 16px; }
  .field-group .label { font-size: 13px; color: var(--gold); font-weight: 700; margin-bottom: 8px; }
  .field-note { font-size: 11.5px; color: var(--muted); margin-top: 6px; }

  .field-row { display: flex; gap: 10px; align-items: center; }
  .field-row .mini-label { font-size: 12px; color: var(--muted); width: 34px; flex-shrink: 0; }
  .field-row input, .field-row select {
    flex: 1;
    width: 100%;
    min-width: 0;
    font-family: inherit;
    font-size: 17px;
    font-weight: 700;
    color: var(--ink);
    background: #F6FAFF;
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 10px;
    box-sizing: border-box;
    font-variant-numeric: tabular-nums;
  }
  .field-row select option { color: #000; }
  .field-row input:focus, .field-row select:focus { outline: none; border-color: var(--coral); }

  .settings-error { color: var(--coral); font-size: 13px; font-weight: 700; margin: 4px 0 6px; min-height: 16px; }

  .settings-actions { display: flex; gap: 12px; margin-top: 10px; }
  .btn-cancel { flex: 1; background: transparent; border: 2px solid var(--border); color: var(--muted); font-size: 15px; padding: 14px; }
  .btn-save { flex: 1; background: var(--coral); color: #FFFFFF; font-size: 15px; padding: 14px; }

  /* =========================================================
     8. RESPONSIVE (short screens)
     ========================================================= */
  @media (max-height: 480px) {
    .settings-panel { padding: 16px 18px; max-height: 94vh; }
    .settings-panel h2 { font-size: 17px; margin-bottom: 2px; }
    .settings-panel .desc { font-size: 11.5px; margin-bottom: 10px; }
    .field-group { margin: 10px 0; }

    .eyebrow { margin-bottom: 4px; }
    .stage { padding: 4px 20px; }
    .ladder { font-size: clamp(13px, 2.6vw, 20px); }
    .ladder tr td { padding: 1px 8px; }
    .ladder .divcol { padding-right: 8px; }
    .final-line { font-size: clamp(14px, 2.8vw, 22px); margin-top: 6px; }
    .mode-label { margin-top: 6px; }
  }


  /* ---- exercise-specific: GCD solution steps ---- */
  .sol { font-family: "Times New Roman", Times, serif; font-size: clamp(16px, 2.8vw, 26px); text-align: left; max-width: 94vw; line-height: 1.5; }
  .sol .intro { color: var(--muted); font-size: 0.8em; margin-bottom: 8px; font-family: inherit; }
  .sol .round { border-top: 1px solid var(--border); padding: 8px 0; margin: 0; }
  .sol .round .hd { color: var(--gold); font-weight: 700; }
  .sol .rem { color: var(--coral); font-weight: 700; }
  .sol .zero { color: var(--muted); }
  .sol .res { color: var(--gold); font-weight: 700; border-top: 1px solid var(--border); padding-top: 8px; }
  /* ให้จัดกึ่งกลางได้โดยเลื่อนขึ้นไปเห็นหัวเฉลยยาว ๆ ได้ (justify-content:center ตัดส่วนบนทิ้ง) */
  .stage { justify-content: flex-start; min-height: 0; }
  .stage > :first-child { margin-top: auto; }
  .stage > :last-child { margin-bottom: auto; }
  .expr.long { font-size: clamp(20px, 4vw, 36px); letter-spacing: 0.02em; }
  @media (max-height: 480px) { .sol { font-size: clamp(12px, 2.2vw, 18px); } .sol .round { padding: 3px 0; } }

  /* Theme A white cards; keep the existing GCD algorithm and long-answer scrolling. */
  .expr, .answer-wrap {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: clamp(18px, 3vw, 28px);
    width: 100%;
    box-shadow: 0 1px 2px rgba(25,46,67,0.03);
  }
  .expr { overflow-wrap: anywhere; }
  .sol { max-width: 100%; font-weight: 400; }
  .sol .hd, .sol .res { font-weight: 700; }
  .katex .mathnormal, .katex .mathdefault, .katex .mathit {
    font-family: "Times New Roman", Times, serif !important;
  }
  .katex .ordinary-number {
    font-family: "Times New Roman", Times, serif !important;
    font-style: normal;
    font-size: calc(1em - 1pt);
  }
  .katex .katex-sizing.reset-size6.size3.mtight { font-size: 0.78em !important; }
  .katex .msupsub { margin-left: 0.08em; }
  @media (max-width: 600px) {
    .stage { padding: 8px 12px; }
    .expr, .answer-wrap { padding: 16px 12px; }
  }
</style>
</head>
<body>

  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <button class="gear-btn" id="gearBtn" aria-label="ตั้งค่า">⚙️</button>

  <div class="eyebrow">สุ่มโจทย์หา ห.ร.ม.</div>

  <div class="stage">
    <div class="expr" id="exprEl">…</div>
    <div class="answer-wrap" id="answerWrap" style="display:none;">
      <div class="sol" id="solEl"></div>
    </div>
    <div class="mode-label" id="modeLabel"></div>
  </div>

  <div class="controls">
    <button class="btn-next" id="nextBtn">ข้อต่อไป</button>
    <button class="btn-toggle" id="toggleBtn">ดูเฉลย</button>
    <button class="btn-end" id="endBtn">จบ</button>
  </div>

  <div class="end-screen" id="endScreen">
    <div class="headline">จบแล้ว สู้ๆ นะ! 🎉</div>
    <div class="sub">ฝึกอีกรอบได้เลยถ้าอยากลองต่อ</div>
    <button class="btn-restart" id="restartBtn">เริ่มใหม่</button>
  </div>

  <div class="settings-overlay" id="settingsOverlay">
    <div class="settings-panel">
      <h2>ตั้งค่าการสุ่มโจทย์</h2>
      <div class="desc">เลือกช่วงระดับความยาก (1–5) ถ้าต้องการระดับเดียว ให้ตั้งต่ำสุดและสูงสุดเท่ากัน</div>

      <div class="field-group">
        <div class="label">ระดับความยาก</div>
        <div class="field-row">
          <span class="mini-label">ต่ำสุด</span>
          <select id="lvMin"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>
        </div>
        <div class="field-row" style="margin-top:8px;">
          <span class="mini-label">สูงสุด</span>
          <select id="lvMax"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>
        </div>
        <div class="field-note">1 = สองจำนวนหลักสิบ … 5 = หลักพัน/หมื่น 3–4 จำนวน</div>
      </div>

      <div class="settings-error" id="settingsError"></div>

      <div class="settings-actions">
        <button class="btn-cancel" id="cancelBtn">ยกเลิก</button>
        <button class="btn-save" id="saveBtn">บันทึก</button>
      </div>
    </div>
  </div>

<script>
/* =========================================================
   1. LEVELS  (ตารางระดับความยาก — ปรับค่าที่นี่)
   digits : จำนวนหลักของแต่ละตัวเลข (2=หลักสิบ 3=ร้อย 4=พัน 5=หมื่น)
   types  : 1 = หา ห.ร.ม. ตรง ๆ, 2 = หารแล้วเหลือเศษเท่ากัน
   g      : ช่วงของคำตอบ (ห.ร.ม. / ตัวหาร)
   minRounds : จำนวนรอบยูคลิดขั้นต่ำที่มีเศษไม่เป็นศูนย์
   ========================================================= */
const LEVELS = {
  1: [ { digits:[2,2],       types:[1],   g:[3,15],   minRounds:2 } ],
  2: [ { digits:[3,3],       types:[1],   g:[5,60],   minRounds:3 } ],
  3: [ { digits:[2,2,3],     types:[1],   g:[3,30],   minRounds:2 },
       { digits:[2,3,3],     types:[1],   g:[3,30],   minRounds:2 } ],
  4: [ { digits:[3,3,3],     types:[1,2], g:[6,60],   minRounds:2 },
       { digits:[4,4,4,4],   types:[1],   g:[10,120], minRounds:2 } ],
  5: [ { digits:[4,4,4],     types:[1,2], g:[10,200], minRounds:3 },
       { digits:[4,4,5],     types:[1,2], g:[10,300], minRounds:3 },
       { digits:[4,4,4,4],   types:[1,2], g:[10,200], minRounds:3 } ]
};
const P_GCD_ONE = 0.08;   // โอกาสที่คำตอบ ห.ร.ม. = 1 (เฉพาะชนิด 1)

const DEFAULT_CFG = { lvMin: 1, lvMax: 5 };
const STORAGE_KEY = "gcd-gen-cfg";
let cfg = { ...DEFAULT_CFG };
try { const s = JSON.parse(localStorage.getItem(STORAGE_KEY)); if (s) cfg = { ...DEFAULT_CFG, ...s }; } catch (e) {}

/* =========================================================
   2. UTILITIES
   ========================================================= */
function randInt(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }
function pick(arr) { return arr[randInt(0, arr.length - 1)]; }
function gcd2(a, b) { while (b) { [a, b] = [b, a % b]; } return a; }
function gcdAll(arr) { return arr.reduce(gcd2, 0); }
function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = randInt(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* =========================================================
   3. GROUP EUCLID  (ยูคลิดแบบหมู่คณะ)
   เอาตัวน้อยสุด m หารตัวอื่นทั้งหมด เก็บเฉพาะเศษที่ไม่เป็น 0
   กลุ่มใหม่ = m + เศษเหล่านั้น ทำซ้ำจน m หารทุกตัวลงตัว
   ========================================================= */
function groupEuclid(nums) {
  let pool = Array.from(new Set(nums)).sort((a, b) => a - b);
  const rounds = [];
  while (true) {
    const m = pool[0];
    const items = pool.slice(1).map((x) => ({ x, r: x % m }));
    const nonzero = Array.from(new Set(items.filter((t) => t.r > 0).map((t) => t.r)));
    rounds.push({ pool: pool.slice(), m, items });
    if (nonzero.length === 0) return { rounds, g: m, count: rounds.length - 1 };
    pool = [m, ...nonzero].sort((a, b) => a - b);
  }
}

/* =========================================================
   4. PROBLEM GENERATION
   สร้างจากคำตอบย้อนกลับ: เลือก g แล้วสร้าง n = k*g (+ r)
   บังคับ gcd ของ k (ชนิด 1) หรือของผลต่าง k (ชนิด 2) เป็น 1
   ทำให้คำตอบเป็น g พอดี
   ========================================================= */
function tryMake(variant, type, strictRounds, wantOne) {
  const g = wantOne ? 1 : randInt(variant.g[0], variant.g[1]);
  const r = type === 2 ? randInt(1, Math.min(g - 1, 30)) : 0;
  if (type === 2 && g < 2) return null;
  const ks = [], nums = [];
  for (const d of variant.digits) {
    const lo = Math.pow(10, d - 1), hi = Math.pow(10, d) - 1;
    const kmin = Math.max(1, Math.ceil((lo - r) / g)), kmax = Math.floor((hi - r) / g);
    if (kmin > kmax) return null;
    const k = randInt(kmin, kmax);
    if (ks.includes(k)) return null;
    ks.push(k); nums.push(k * g + r);
  }
  if (type === 1) { if (gcdAll(ks) !== 1) return null; }
  else { const kb = Math.min(...ks); if (gcdAll(ks.map((k) => k - kb)) !== 1) return null; }
  const euclidInput = type === 1 ? nums : (() => { const b = Math.min(...nums); return nums.filter((x) => x !== b).map((x) => x - b); })();
  const ge = groupEuclid(euclidInput);
  if (ge.g !== g) return null;                       // ตรวจความถูกต้อง
  if (g > 1 && strictRounds && ge.count < variant.minRounds) return null;
  if (g === 1 && ge.count < 1) return null;
  return { nums: shuffle(nums), type, g, r };
}

function genProblem() {
  const lv = randInt(cfg.lvMin, cfg.lvMax);
  const variant = pick(LEVELS[lv]);
  const type = pick(variant.types);
  const wantOne = type === 1 && Math.random() < P_GCD_ONE;
  for (let i = 0; i < 6000; i++) {
    const p = tryMake(variant, type, i < 2500, wantOne);
    if (p) { p.level = lv; return p; }
  }
  return genProblem();
}

/* =========================================================
   5. RENDER
   ========================================================= */
const $ = (id) => document.getElementById(id);
const exprEl = $("exprEl"), answerWrap = $("answerWrap"), solEl = $("solEl"), modeLabel = $("modeLabel");
let current = null, showingAnswer = false;

function problemText(p) {
  const list = p.nums.join(", ");
  if (p.type === 1) return `หา ห.ร.ม. ของ ${list}`;
  return `เมื่อเลขจำนวนหนึ่งไปหาร ${list} แล้วเหลือเศษเท่ากัน จงหาจำนวนที่มากที่สุดที่สามารถเป็นตัวหารนั้นได้ และเศษที่เหลือจากการหาร`;
}

function roundsHTML(ge) {
  let h = "";
  ge.rounds.forEach((rd, i) => {
    const last = i === ge.rounds.length - 1;
    h += `<div class="round"><div class="hd">รอบ ${i + 1}: ${rd.pool.join(", ")} (ตัวน้อยสุด ${rd.m})</div>`;
    if (rd.items.length === 0) { h += `<div>มีตัวเดียว → ห.ร.ม. = ${rd.m}</div>`; }
    rd.items.forEach((t) => {
      h += t.r > 0
        ? `<div>${t.x} ÷ ${rd.m} เศษ <span class="rem">${t.r}</span></div>`
        : `<div class="zero">${t.x} ÷ ${rd.m} ลงตัว (ตัดทิ้ง)</div>`;
    });
    h += last
      ? `<div>${rd.m} หารทุกตัวลงตัว → หยุด ได้ <span class="res">${rd.m}</span></div>`
      : `<div>กลุ่มใหม่: ${[rd.m, ...Array.from(new Set(rd.items.filter((t) => t.r > 0).map((t) => t.r)))].sort((a, b) => a - b).join(", ")}</div>`;
    h += `</div>`;
  });
  return h;
}

function solutionHTML(p) {
  if (p.type === 1) {
    const ge = groupEuclid(p.nums);
    return `<div class="intro">ชนิดที่ 1 · ยูคลิดแบบหมู่คณะ</div>${roundsHTML(ge)}<div class="res">ห.ร.ม. = ${ge.g}</div>`;
  }
  const base = Math.min(...p.nums);
  const others = p.nums.filter((x) => x !== base).sort((a, b) => a - b);
  const diffs = others.map((x) => x - base);
  const ge = groupEuclid(diffs);
  let h = `<div class="intro">ชนิดที่ 2 · เหลือเศษเท่ากัน</div>`;
  h += `<div class="round"><div class="hd">ขั้นเตรียม: ลบกันให้เศษหายไป</div>`;
  h += `<div>ตัวน้อยสุดคือ ${base} นำมาเป็นฐาน ลบออกจากตัวอื่นทุกตัว</div>`;
  others.forEach((x) => { h += `<div>${x} − ${base} = <span class="rem">${x - base}</span></div>`; });
  h += `<div>เศษเท่ากันจึงหักล้างกันหมด ผลต่างทุกตัวต้องหารด้วยตัวหารลงตัว ดังนั้นตัวหาร = ห.ร.ม. ของ ${diffs.join(", ")}</div></div>`;
  h += roundsHTML(ge);
  h += `<div class="round"><div class="hd">หาเศษ</div>`;
  p.nums.slice().sort((a, b) => a - b).forEach((x) => { h += `<div>${x} ÷ ${ge.g} เศษ ${x % ge.g}</div>`; });
  h += `</div><div class="res">ตัวหาร = ${ge.g}, เศษ = ${base % ge.g}</div>`;
  return h;
}


/* Presentation only: KaTeX numbers in Thai problem/solution text. */
function styleOrdinaryMathNumbers(renderedHtml) {
  const template = document.createElement('template');
  template.innerHTML = renderedHtml;
  template.content.querySelectorAll('.katex-html .mord').forEach(atom => {
    if (atom.children.length || !/^\d+(?:\.\d+)?$/.test(atom.textContent.trim())) return;
    if (atom.closest('.mfrac, .msupsub, .vlist, .sqrt, .root, .sizing, .accent, .op-limits')) return;
    atom.classList.add('ordinary-number');
  });
  return template.innerHTML;
}
function renderGcdMathNumbers(root) {
  if (typeof katex === 'undefined') return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const textNodes = [];
  while (walker.nextNode()) {
    const node = walker.currentNode;
    if (node.parentElement.closest('.katex, script, style')) continue;
    if (/\d/.test(node.nodeValue)) textNodes.push(node);
  }
  textNodes.forEach(node => {
    const chunks = node.nodeValue.split(/(\d+(?:\.\d+)?)/g);
    if (chunks.length === 1) return;
    const frag = document.createDocumentFragment();
    chunks.forEach(chunk => {
      if (!/^\d+(?:\.\d+)?$/.test(chunk)) {
        frag.appendChild(document.createTextNode(chunk));
      } else {
        const span = document.createElement('span');
        span.className = 'inline-gcd-math';
        span.innerHTML = styleOrdinaryMathNumbers(katex.renderToString(chunk, {throwOnError:false}));
        frag.appendChild(span);
      }
    });
    node.replaceWith(frag);
  });
}

function setLabel() { modeLabel.textContent = `ระดับ ${current.level} · ชนิดที่ ${current.type}`; }

function displayProblem() {
  exprEl.style.display = ""; answerWrap.style.display = "none";
  $("toggleBtn").textContent = "ดูเฉลย"; setLabel();
}
function displayAnswer() {
  exprEl.style.display = "none"; answerWrap.style.display = "";
  solEl.innerHTML = solutionHTML(current);
  renderGcdMathNumbers(solEl);
  $("toggleBtn").textContent = "ดูโจทย์"; setLabel();
}
function newProblem() {
  current = genProblem();
  exprEl.textContent = problemText(current);
  renderGcdMathNumbers(exprEl);
  exprEl.classList.toggle("long", current.type === 2);
}
function showNext() {
  exprEl.classList.add("swap"); answerWrap.classList.add("swap");
  setTimeout(() => { newProblem(); showingAnswer = false; displayProblem(); exprEl.classList.remove("swap"); answerWrap.classList.remove("swap"); }, 150);
}
function toggleAnswer() {
  const el = showingAnswer ? answerWrap : exprEl;
  el.classList.add("swap");
  setTimeout(() => { showingAnswer = !showingAnswer; showingAnswer ? displayAnswer() : displayProblem(); (showingAnswer ? answerWrap : exprEl).classList.remove("swap"); }, 150);
}

/* =========================================================
   6. EVENTS + SETTINGS
   ========================================================= */
$("nextBtn").addEventListener("click", showNext);
$("toggleBtn").addEventListener("click", toggleAnswer);
$("endBtn").addEventListener("click", () => $("endScreen").classList.add("show"));
$("restartBtn").addEventListener("click", () => { $("endScreen").classList.remove("show"); showNext(); });

const ov = $("settingsOverlay");
$("gearBtn").addEventListener("click", () => { $("lvMin").value = cfg.lvMin; $("lvMax").value = cfg.lvMax; $("settingsError").textContent = ""; ov.classList.add("show"); });
$("cancelBtn").addEventListener("click", () => ov.classList.remove("show"));
ov.addEventListener("click", (e) => { if (e.target === ov) ov.classList.remove("show"); });
$("saveBtn").addEventListener("click", () => {
  const a = parseInt($("lvMin").value, 10), b = parseInt($("lvMax").value, 10);
  if (a > b) { $("settingsError").textContent = "ระดับต่ำสุดต้องไม่มากกว่าระดับสูงสุด"; return; }
  cfg = { lvMin: a, lvMax: b };
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(cfg)); } catch (e) {}
  ov.classList.remove("show"); showNext();
});

newProblem(); displayProblem();
