<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Mathematics-123 Exercises</title>

<style>

/* ===== พื้นฐานทั้งหน้า ===== */

body {
    font-family: Arial, sans-serif;
    background-color: #eef5ff;
    margin: 0;
    padding: 24px;
    box-sizing: border-box;
}


/* ===== กล่องหลัก ===== */

.container {
    width: min(94%, 1000px);
    margin: 0 auto;
}


/* ===== หัวข้อ ===== */

h1 {
    text-align: center;
    color: #222222;

    font-size: clamp(24px, 3vw, 34px);

    margin-top: 20px;
    margin-bottom: 28px;
}


/* ===== Grid สำหรับรายการแบบฝึก ===== */

.exercise-grid {
    display: grid;

    /* 2 คอลัมน์ ขนาดเท่ากัน */
    /* grid-template-columns: repeat(2, 1fr); */

    /* ใช้ 1 คอลัมน์ */
    grid-template-columns: 1fr;

    /* ระยะห่างระหว่างปุ่ม */
    gap: 14px;
}


/* ===== Link / ปุ่มเลือกแบบฝึก ===== */

.exercise-grid a {
    display: flex;

    /* จัดข้อความให้อยู่กลางปุ่ม */
    align-items: center;
    justify-content: center;

    background-color: white;
    color: #0057d9;

    font-size: clamp(17px, 1.8vw, 21px);
    font-weight: 500;

    text-decoration: underline;
    text-align: center;

    padding: 18px 20px;

    border: 1px solid #cccccc;
    border-radius: 10px;

    box-sizing: border-box;

    /* ทำให้ปุ่มในแต่ละแถวดูสม่ำเสมอ */
    min-height: 72px;
}


/* เมื่อนำ mouse ไปชี้บน laptop/desktop */

.exercise-grid a:hover {
    background-color: #e4edff;
}


/* ตอนกด */

.exercise-grid a:active {
    background-color: #d8e5ff;
}


/* ==================================================
   Smartphone แนวตั้ง
   ================================================== */

@media (max-width: 600px) {

    body {
        padding: 12px;
    }

    .container {
        width: 100%;
    }

    h1 {
        margin-top: 14px;
        margin-bottom: 20px;
    }

    /* Smartphone ใช้ 1 คอลัมน์ */
    .exercise-grid {
        grid-template-columns: 1fr;
        gap: 12px;
    }

    .exercise-grid a {
        padding: 18px 16px;
        min-height: 64px;
    }

}


/* ==================================================
   Tablet / iPad
   ================================================== */

@media (min-width: 601px) and (max-width: 1024px) {

    .container {
        width: min(94%, 900px);
    }

}


/* ==================================================
   Laptop / Desktop
   ================================================== */

@media (min-width: 1025px) {

    .container {
        width: 1000px;
        max-width: 94%;
    }

}

</style>

</head>


<body>

<div class="container">

    <h1>แบบฝึกคณิตศาสตร์มัธยมศึกษาตอนต้น</h1>


    <div class="exercise-grid">

        <a href="fraction.html">

        <a href="linear-equation.html">

        </a>

        <a href="word-to-equation.html">
            การแก้สมการจากข้อความ
        </a>

        <a href="system-of-equations.html">
            ระบบสมการเชิงเส้นสองตัวแปร
        </a>

        <a href="inequalities.html">

        </a>

        <a href="quadratic-equation.html">

        <a href="radical-simplification.html">

    </div>

</div>

</body>
</html>
