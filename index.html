<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Mathematics-123 Tools</title>

<style>

/* ===== พื้นฐานทั้งหน้า ===== */

body {
    font-family: Arial, sans-serif;
    background-color: #eef5ff;
    margin: 0;
    padding: 24px;
    box-sizing: border-box;
}


/* ===== กล่องหลัก ===== */

.container {
    width: min(92%, 760px);
    margin: 0 auto;
}


/* ===== หัวข้อ ===== */

h1 {
    text-align: center;
    color: #222222;

    /* ปรับขนาดตัวอักษรตามขนาดจอ */
    font-size: clamp(24px, 3vw, 34px);

    margin-top: 20px;
    margin-bottom: 28px;
}


/* ===== Link / ปุ่มเลือกแบบฝึก ===== */

a {
    display: block;

    background-color: white;
    color: #0057d9;

    font-size: clamp(18px, 2vw, 22px);
    font-weight: 500;

    text-decoration: underline;

    padding: 18px 22px;
    margin: 14px 0;

    border: 1px solid #cccccc;
    border-radius: 10px;

    box-sizing: border-box;
}


/* เมื่อนำ mouse ไปชี้บน laptop/desktop */

a:hover {
    background-color: #e4edff;
}


/* ตอนกด */

a:active {
    background-color: #d8e5ff;
}


/* ==================================================
   Smartphone แนวตั้ง
   ================================================== */

@media (max-width: 600px) {

    body {
        padding: 12px;
    }

    .container {
        width: 100%;
    }

    h1 {
        margin-top: 14px;
        margin-bottom: 20px;
    }

    a {
        padding: 18px 16px;
        margin: 12px 0;
    }

}


/* ==================================================
   Tablet / iPad
   ================================================== */

@media (min-width: 601px) and (max-width: 1024px) {

    .container {
        width: min(90%, 700px);
    }

}


/* ==================================================
   Laptop / Desktop
   ================================================== */

@media (min-width: 1025px) {

    .container {
        width: 700px;
    }

}

</style>

</head>


<body>

<div class="container">

    <h1>แบบฝึกคณิตศาสตร์มัธยมศึกษาตอนต้น</h1>

    <a href="divisible.html">
        กฎการหารลงตัว
    </a>

    <a href="fraction.html">
        การคำนวณเศษส่วน
    </a>

    <a href="linear-equation.html">
        สมการเชิงเส้นตัวแปรเดียว
    </a>

    <a href="word-to-equation.html">
        การแก้สมการจากข้อความ
    </a>

    <a href="system-of-equations.html">
        ระบบสมการเชิงเส้นสองตัวแปร
    </a>

    <a href="inequalities.html">
        อสมการเชิงเส้นตัวแปรเดียว (มีเฉลย)
    </a>

    <a href="quadratic-equation.html">
        สมการกำลังสองตัวแปรเดียว (มีเฉลย)
    </a>
    
</div>

</body>
</html>
