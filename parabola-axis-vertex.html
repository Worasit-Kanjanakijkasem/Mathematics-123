<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>สมการและกราฟของพาราโบลา</title>
<style>

  /* =========================================================
     1. BASE / VARIABLES
     ========================================================= */
  :root {
    --navy: #2F3C7E;
    --navy-deep: #232D63;
    --coral: #F96167;
    --coral-deep: #E14A50;
    --gold: #F9E795;
    --ink: #FFFFFF;
    --muted: #B9C0E0;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { margin: 0; overflow: hidden; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", "Noto Sans Thai", sans-serif;
    background: var(--navy);
    color: var(--ink);
    height: 100dvh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
    position: relative;
  }

  /* =========================================================
     2. BACKGROUND DECORATION
     ========================================================= */
  .blob { position: absolute; border-radius: 50%; pointer-events: none; }
  .blob-1 { width: 38vmax; height: 38vmax; background: var(--coral); opacity: 0.10; top: -14vmax; right: -12vmax; }
  .blob-2 { width: 26vmax; height: 26vmax; background: var(--gold); opacity: 0.08; bottom: -10vmax; left: -8vmax; }

  /* =========================================================
     3. HEADER (eyebrow) + GEAR BUTTON
     ========================================================= */
  .eyebrow {
    letter-spacing: 0.12em;
    font-size: clamp(13px, 1.6vw, 18px);
    font-weight: 700;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 8px;
    z-index: 1;
  }

  .gear-btn {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    z-index: 2;
    padding: 0;
  }
  .gear-btn:active { background: rgba(255, 255, 255, 0.18); }

  /* =========================================================
     4. STAGE (problem / answer area)
     ---- note: the answer stacks a graph above three summary
     lines, which can run tall on short mobile screens, so —
     like the other graph-based tools — the stage keeps its own
     padding + scroll as a deliberate exception. ----
     ========================================================= */
  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    width: 100%;
    z-index: 1;
    padding: 10px 20px;
    overflow-y: auto;
  }

  .expr {
    font-family: "Cambria", "Georgia", serif;
    font-size: clamp(22px, 4.6vw, 42px);
    font-weight: 700;
    text-align: center;
    line-height: 1.35;
    max-width: 95vw;
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  .expr.swap { opacity: 0; transform: scale(0.95); }

  .answer-wrap { transition: opacity 0.15s ease, transform 0.15s ease; text-align: center; }
  .answer-wrap.swap { opacity: 0; transform: scale(0.95); }

  /* ---- exercise-specific: fraction display (h, k, roots) ---- */
  .frac {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    vertical-align: middle;
    margin: 0 0.1em;
    line-height: 1.05;
  }
  .frac .num, .frac .den { display: block; padding: 0 0.1em; }
  .frac .num { border-bottom: 0.06em solid currentColor; padding-bottom: 0.04em; }
  .frac .den { padding-top: 0.04em; }

  .graph-box { width: min(78vw, 380px); margin: 0 auto; }
  .graph-box svg { width: 100%; height: auto; display: block; }

  .answer-lines { margin-top: 10px; }
  .answer-line {
    font-family: "Cambria", "Georgia", serif;
    font-size: clamp(17px, 3.2vw, 28px);
    font-weight: 700;
    color: var(--gold);
    text-align: center;
    line-height: 1.6;
  }

  .mode-label {
    margin-top: 16px;
    font-size: clamp(13px, 1.8vw, 18px);
    color: var(--muted);
    text-align: center;
    z-index: 1;
  }

  /* =========================================================
     5. MAIN CONTROLS (next / toggle / end)
     ========================================================= */
  .controls {
    display: flex;
    gap: 14px;
    width: 100%;
    max-width: 760px;
    padding: 8px 24px clamp(12px, 3vh, 30px);
    z-index: 1;
    flex-shrink: 0;
  }

  button {
    border: none;
    border-radius: 20px;
    font-family: inherit;
    font-weight: 700;
    cursor: pointer;
    -webkit-appearance: none;
    transition: transform 0.08s ease, filter 0.15s ease;
  }
  button:active { transform: scale(0.96); }

  .btn-next {
    flex: 2;
    background: var(--coral);
    color: var(--ink);
    font-size: clamp(13px, 2.1vw, 22px);
    padding: clamp(12px, 2.4vh, 20px) 10px;
    white-space: nowrap;
  }

  .btn-toggle {
    flex: 2;
    background: var(--navy-deep);
    color: var(--gold);
    border: 2px solid var(--gold);
    font-size: clamp(13px, 1.9vw, 20px);
    padding: clamp(12px, 2.4vh, 20px) 16px;
  }

  .btn-end {
    flex: 1;
    background: transparent;
    color: var(--muted);
    border: 2px solid var(--navy-deep);
    font-size: clamp(12px, 1.6vw, 18px);
    padding: clamp(12px, 2.4vh, 20px) 12px;
  }
  .btn-end:active { background: var(--navy-deep); }

  /* =========================================================
     6. END SCREEN
     ========================================================= */
  .end-screen {
    position: fixed;
    inset: 0;
    background: var(--navy-deep);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    z-index: 10;
  }
  .end-screen.show { display: flex; }
  .end-screen .headline { font-size: clamp(32px, 6vw, 56px); font-weight: 800; margin-bottom: 12px; }
  .end-screen .sub { color: var(--muted); font-size: clamp(16px, 2.4vw, 22px); margin-bottom: 36px; }

  .btn-restart {
    background: var(--gold);
    color: var(--navy-deep);
    font-size: clamp(17px, 2.4vw, 22px);
    padding: 18px 40px;
    border-radius: 20px;
  }

  /* =========================================================
     7. SETTINGS PANEL
     ========================================================= */
  .settings-overlay {
    position: fixed;
    inset: 0;
    background: rgba(20, 24, 54, 0.75);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 20;
    padding: 20px;
    overflow-y: auto;
  }
  .settings-overlay.show { display: flex; }

  .settings-panel {
    background: var(--navy-deep);
    border-radius: 22px;
    padding: 28px 24px;
    width: 100%;
    max-width: 420px;
    max-height: 92vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4), inset 0 -28px 22px -24px rgba(0, 0, 0, 0.45);
  }
  .settings-panel h2 { margin: 0 0 4px; font-size: 20px; font-weight: 800; }
  .settings-panel .desc { color: var(--muted); font-size: 13px; margin-bottom: 18px; }

  .field-group { margin-bottom: 16px; }
  .field-group .label { font-size: 13px; color: var(--gold); font-weight: 700; margin-bottom: 8px; }
  .field-note { font-size: 11.5px; color: var(--muted); margin-top: 6px; }

  .field-row { display: flex; gap: 10px; align-items: center; }
  .field-row .mini-label { font-size: 12px; color: var(--muted); width: 34px; flex-shrink: 0; }
  .field-row input {
    flex: 1;
    width: 100%;
    min-width: 0;
    font-family: inherit;
    font-size: 17px;
    font-weight: 700;
    color: var(--ink);
    background: rgba(255, 255, 255, 0.08);
    border: 2px solid rgba(255, 255, 255, 0.12);
    border-radius: 10px;
    padding: 10px;
    box-sizing: border-box;
    font-variant-numeric: tabular-nums;
  }
  .field-row input:focus { outline: none; border-color: var(--coral); }

  .settings-error { color: var(--coral); font-size: 13px; font-weight: 700; margin: 4px 0 6px; min-height: 16px; }

  .settings-actions { display: flex; gap: 12px; margin-top: 10px; }
  .btn-cancel { flex: 1; background: transparent; border: 2px solid rgba(255, 255, 255, 0.15); color: var(--muted); font-size: 15px; padding: 14px; }
  .btn-save { flex: 1; background: var(--coral); color: var(--ink); font-size: 15px; padding: 14px; }

  /* =========================================================
     8. RESPONSIVE (short screens)
     ========================================================= */
  @media (max-height: 480px) {
    .settings-panel { padding: 16px 18px; max-height: 94vh; }
    .settings-panel h2 { font-size: 17px; margin-bottom: 2px; }
    .settings-panel .desc { font-size: 11.5px; margin-bottom: 10px; }
    .field-group { margin: 10px 0; }

    .graph-box { width: min(64vw, 280px); }
    .answer-lines { margin-top: 4px; }
    .mode-label { margin-top: 6px; }
  }

</style>
</head>
<body>

  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <button class="gear-btn" id="gearBtn" aria-label="ตั้งค่า">⚙️</button>

  <div class="eyebrow">สมการและกราฟของพาราโบลา</div>

  <div class="stage">
    <div class="expr" id="exprEl">…</div>
    <div class="answer-wrap" id="answerWrap" style="display:none;">
      <div class="graph-box" id="graphBox"></div>
      <div class="answer-lines">
        <div class="answer-line" id="axisLine"></div>
        <div class="answer-line" id="vertexLine"></div>
        <div class="answer-line" id="rootsLine"></div>
      </div>
    </div>
    <div class="mode-label" id="modeLabel">หาแกนสมมาตร จุดยอด และจุดตัดแกน x</div>
  </div>

  <div class="controls">
    <button class="btn-next" id="nextBtn">สุ่มข้อถัดไป ⚡</button>
    <button class="btn-toggle" id="toggleBtn">โจทย์ / เฉลย</button>
    <button class="btn-end" id="endBtn">จบ</button>
  </div>

  <div class="end-screen" id="endScreen">
    <div class="headline">จบแล้ว สู้ๆ นะ! 🎉</div>
    <div class="sub">ฝึกอีกรอบได้เลยถ้าอยากลองต่อ</div>
    <button class="btn-restart" id="restartBtn">เริ่มใหม่</button>
  </div>

  <div class="settings-overlay" id="settingsOverlay">
    <div class="settings-panel">
      <h2>ตั้งค่าการสุ่มสมการ</h2>
      <div class="desc">กำหนดช่วงของ a, b, c</div>

      <div class="field-group">
        <div class="label">a (สัมประสิทธิ์ x²)</div>
        <div class="field-row">
          <span class="mini-label">ต่ำสุด</span><input type="number" id="aMin">
          <span class="mini-label">สูงสุด</span><input type="number" id="aMax">
        </div>
        <div class="field-note">ห้ามเป็น 0</div>
      </div>

      <div class="field-group">
        <div class="label">b (สัมประสิทธิ์ x)</div>
        <div class="field-row">
          <span class="mini-label">ต่ำสุด</span><input type="number" id="bMin">
          <span class="mini-label">สูงสุด</span><input type="number" id="bMax">
        </div>
      </div>

      <div class="field-group">
        <div class="label">c (พจน์คงตัว)</div>
        <div class="field-row">
          <span class="mini-label">ต่ำสุด</span><input type="number" id="cMin">
          <span class="mini-label">สูงสุด</span><input type="number" id="cMax">
        </div>
      </div>

      <div class="settings-error" id="settingsError"></div>

      <div class="settings-actions">
        <button class="btn-cancel" id="cancelBtn">ยกเลิก</button>
        <button class="btn-save" id="saveBtn">บันทึก</button>
      </div>
    </div>
  </div>

<script>

  /* =========================================================
     1. CONFIG
     ========================================================= */
  const DEFAULT_CFG = { aMin: -10, aMax: 10, bMin: -10, bMax: 10, cMin: -20, cMax: 20 };
  const STORAGE_KEY = "parabola-axis-vertex-gen-cfg";

  let cfg = { ...DEFAULT_CFG };
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (saved) cfg = { ...DEFAULT_CFG, ...saved };
  } catch (e) {}

  /* =========================================================
     2. DOM REFERENCES
     ========================================================= */
  // stage
  const exprEl = document.getElementById("exprEl");
  const answerWrap = document.getElementById("answerWrap");
  const graphBox = document.getElementById("graphBox");
  const axisLine = document.getElementById("axisLine");
  const vertexLine = document.getElementById("vertexLine");
  const rootsLine = document.getElementById("rootsLine");
  const modeLabel = document.getElementById("modeLabel");

  // main controls
  const nextBtn = document.getElementById("nextBtn");
  const toggleBtn = document.getElementById("toggleBtn");
  const endBtn = document.getElementById("endBtn");
  const endScreen = document.getElementById("endScreen");
  const restartBtn = document.getElementById("restartBtn");

  // settings
  const gearBtn = document.getElementById("gearBtn");
  const settingsOverlay = document.getElementById("settingsOverlay");
  const settingsError = document.getElementById("settingsError");
  const cancelBtn = document.getElementById("cancelBtn");
  const saveBtn = document.getElementById("saveBtn");
  const fieldIds = ["aMin", "aMax", "bMin", "bMax", "cMin", "cMax"];

  /* =========================================================
     3. STATE
     ========================================================= */
  let current = null;
  let showingAnswer = false;

  /* =========================================================
     4. GENERIC UTILITIES
     ========================================================= */
  function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
  function choice(arr) { return arr[randInt(0, arr.length - 1)]; }
  function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); return b === 0 ? a : gcd(b, a % b); }

  function toSimpleFraction(x, maxDen = 48, eps = 1e-6) {
    if (Math.abs(x - Math.round(x)) < eps) return { p: Math.round(x), q: 1 };
    for (let d = 2; d <= maxDen; d++) {
      const p = x * d;
      if (Math.abs(p - Math.round(p)) < eps) {
        let rp = Math.round(p), rd = d;
        const g = gcd(Math.abs(rp), rd);
        return { p: rp / g, q: rd / g };
      }
    }
    return { p: x, q: 1 };
  }

  function fmtFracHTML(frac) {
    const sign = frac.p < 0 ? "\u2212" : "";
    const absP = Math.abs(frac.p);
    if (frac.q === 1) return `${sign}${absP}`;
    return `${sign}<span class="frac"><span class="num">${absP}</span><span class="den">${frac.q}</span></span>`;
  }
  function fmtNumHTML(x) { return fmtFracHTML(toSimpleFraction(x)); }

  /* =========================================================
     5. EXPRESSION GENERATOR
     Category is chosen first (2 real roots 47.5% / no real roots
     47.5% / touches the x-axis 5%), then a,b are sampled freely
     from their configured ranges and c is solved backward from
     the vertex height k needed for that category — since
     discriminant = -4*a*k exactly (verified symbolically before
     implementing): same sign(a,k) -> no roots, opposite signs ->
     2 roots, k=0 -> touches. Retried whenever a*h² leaves no room
     to pick a nonzero k of the right sign while keeping c inside
     its configured range — verified empirically to need only
     ~1.02 attempts on average, never more than a handful.
     ========================================================= */
  const CATEGORY_WEIGHTS = [["two-roots", 0.475], ["no-roots", 0.475], ["touch", 0.05]];

  function pickCategory() {
    const r = Math.random();
    let acc = 0;
    for (const [name, w] of CATEGORY_WEIGHTS) { acc += w; if (r < acc) return name; }
    return CATEGORY_WEIGHTS[CATEGORY_WEIGHTS.length - 1][0];
  }

  const ROOT_RANGE = 5; // magnitude range for generating clean integer roots

  function generateQuadratic() {
    const category = pickCategory();

    // "two-roots" and "touch" are generated root-first (clean integer roots, then a,b,c
    // derived via Vieta's formulas) — deriving c from a target k instead, as done for
    // "no-roots" below, gives roots via the quadratic formula that are only rational
    // when the discriminant happens to be a perfect square, which is rare, so a real
    // (non-touching) case built that way almost always shows ugly irrational roots.
    if (category === "two-roots" || category === "touch") {
      for (let attempt = 0; attempt < 500; attempt++) {
        const a = choice(Array.from({ length: cfg.aMax - cfg.aMin + 1 }, (_, i) => cfg.aMin + i).filter((v) => v !== 0));
        let r1, r2;
        if (category === "touch") {
          r1 = r2 = randInt(-ROOT_RANGE, ROOT_RANGE);
        } else {
          r1 = randInt(-ROOT_RANGE, ROOT_RANGE);
          do { r2 = randInt(-ROOT_RANGE, ROOT_RANGE); } while (r2 === r1);
        }
        const b = -a * (r1 + r2);
        const c = a * r1 * r2;
        if (b >= cfg.bMin && b <= cfg.bMax && c >= cfg.cMin && c <= cfg.cMax) {
          const h = -b / (2 * a);
          const k = a * h * h + b * h + c;
          return { a, b, c, h, k, category };
        }
      }
      // fallback (should not realistically trigger given the verified low retry count)
      return { a: 1, b: 0, c: -1, h: 0, k: -1, category: "two-roots" };
    }

    // "no-roots": no real root to keep clean, so the direct k-first approach (verified
    // separately) is simpler and works fine here.
    for (let attempt = 0; attempt < 300; attempt++) {
      const a = choice(Array.from({ length: cfg.aMax - cfg.aMin + 1 }, (_, i) => cfg.aMin + i).filter((v) => v !== 0));
      const b = randInt(cfg.bMin, cfg.bMax);
      const h = -b / (2 * a);
      const ah2 = a * h * h; // = b^2/(4a)

      if (!(ah2 > cfg.cMin && ah2 < cfg.cMax)) continue;

      const [lo, hi] = a > 0 ? [0, cfg.cMax - ah2] : [cfg.cMin - ah2, 0];
      const intLo = Number.isInteger(lo) ? lo + 1 : Math.ceil(lo);
      const intHi = Number.isInteger(hi) ? hi - 1 : Math.floor(hi);
      const kOptions = [];
      for (let k = intLo; k <= intHi; k++) if (k !== 0) kOptions.push(k);
      if (kOptions.length === 0) continue;

      const k = choice(kOptions);
      const c = ah2 + k;
      if (c >= cfg.cMin && c <= cfg.cMax) {
        return { a, b, c, h, k, category };
      }
    }
    // fallback (should not realistically trigger given the verified low retry count)
    const a = 1, b = 0, c = 1;
    return { a, b, c, h: 0, k: 1, category: "no-roots" };
  }

  function fmtQuadratic(a, b, c) {
    let s = "";
    if (a === 1) s += "x\u00b2";
    else if (a === -1) s += "\u2212x\u00b2";
    else s += `${fmtNumHTML(a)}x\u00b2`;
    if (b !== 0) {
      const absB = Math.abs(b);
      const bStr = absB === 1 ? "x" : `${absB}x`;
      s += ` ${b > 0 ? "+" : "\u2212"} ${bStr}`;
    }
    if (c !== 0) {
      const cFrac = toSimpleFraction(c);
      s += ` ${cFrac.p >= 0 ? "+" : "\u2212"} ${fmtFracHTML({ p: Math.abs(cFrac.p), q: cFrac.q })}`;
    }
    return `y = ${s}`;
  }

  function newProblem() {
    current = generateQuadratic();
    return fmtQuadratic(current.a, current.b, current.c);
  }

  /* =========================================================
     6. GRAPH RENDERING
     Focuses on the axis of symmetry and vertex — the curve's
     own equation label (in vertex form) is anchored to the
     vertex and placed on whichever side the parabola's arms
     leave empty (below for a>0, above for a<0), the same
     convention already used for the absolute-value V-graphs.
     ========================================================= */
  function computeViewport(a, b, c, h, k, roots) {
    const keyXs = [h, 0];
    if (roots) keyXs.push(...roots);
    let xLo = Math.min(...keyXs), xHi = Math.max(...keyXs);
    let spanX = xHi - xLo;
    if (spanX < 2) { const mid = (xLo + xHi) / 2; xLo = mid - 1; xHi = mid + 1; spanX = 2; }
    const padX = spanX * 0.3;
    xLo -= padX; xHi += padX;

    const f = (x) => a * x * x + b * x + c;
    const candidates = [0, f(xLo), f(xHi), k];
    let yLo = Math.min(...candidates), yHi = Math.max(...candidates);
    let spanY = yHi - yLo;
    if (spanY < 2) { const mid = (yLo + yHi) / 2; yLo = mid - 1; yHi = mid + 1; spanY = 2; }
    const padY = spanY * 0.15;
    yLo -= padY; yHi += padY;
    return { xLo, xHi, yLo, yHi };
  }

  function buildGraph(a, b, c, h, k, roots) {
    const { xLo, xHi, yLo, yHi } = computeViewport(a, b, c, h, k, roots);
    const w = 320, hgt = 320, pad = 28;
    const scaleX = (w - pad * 2) / (xHi - xLo);
    const scaleY = (hgt - pad * 2) / (yHi - yLo);
    const toPx = (x) => pad + (x - xLo) * scaleX;
    const toPy = (y) => hgt - pad - (y - yLo) * scaleY;

    let svg = `<svg viewBox="0 0 ${w} ${hgt}" xmlns="http://www.w3.org/2000/svg">`;
    const axisColor = "#7A8296";

    svg += `<line x1="${toPx(xLo)}" y1="${toPy(0)}" x2="${toPx(xHi)}" y2="${toPy(0)}" stroke="${axisColor}" stroke-width="1.1"/>`;
    svg += `<line x1="${toPx(0)}" y1="${toPy(yHi)}" x2="${toPx(0)}" y2="${toPy(yLo)}" stroke="${axisColor}" stroke-width="1.1"/>`;

    // axis of symmetry (vertical dashed gold line through the vertex)
    svg += `<line x1="${toPx(h)}" y1="${toPy(yHi)}" x2="${toPx(h)}" y2="${toPy(yLo)}" stroke="#F9E795" stroke-width="1.5" stroke-dasharray="5 4"/>`;

    // curve
    const f = (x) => a * x * x + b * x + c;
    const steps = 60;
    let d = "";
    for (let i = 0; i <= steps; i++) {
      const x = xLo + ((xHi - xLo) * i) / steps;
      d += (i === 0 ? "M" : "L") + toPx(x).toFixed(1) + "," + toPy(f(x)).toFixed(1) + " ";
    }
    svg += `<path d="${d}" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>`;

    // x-intercept markers, if any
    if (roots) {
      roots.forEach((r) => {
        svg += `<circle cx="${toPx(r)}" cy="${toPy(0)}" r="4" fill="#F96167" stroke="#232D63" stroke-width="1"/>`;
      });
    }

    // vertex marker + vertex-form label — anchored to the vertex, placed on the side
    // the curve's arms leave empty (below for a>0, above for a<0).
    svg += `<circle cx="${toPx(h)}" cy="${toPy(k)}" r="4.5" fill="#F9E795" stroke="#232D63" stroke-width="1.25"/>`;
    const vLabelPlain = fmtVertexLabelPlain(a, h, k);
    const vertexPx = toPx(h), vertexPy = toPy(k);
    const vLabelY = a > 0 ? vertexPy + 20 : vertexPy - 12;
    const vHalfWidth = (vLabelPlain.length * 12.5 * 0.58) / 2 + 4;
    const vLabelX = Math.max(vHalfWidth, Math.min(w - vHalfWidth, vertexPx));
    svg += `<text x="${vLabelX}" y="${vLabelY}" font-size="12.5" fill="#F9E795" font-weight="700" text-anchor="middle" font-family="Calibri, sans-serif">${vLabelPlain}</text>`;

    svg += "</svg>";
    return svg;
  }

  // plain-text (no HTML spans) version of the vertex label, for SVG <text> which cannot
  // render the stacked .frac markup used elsewhere.
  function fmtNumPlain(x) {
    const f = toSimpleFraction(x);
    const sign = f.p < 0 ? "\u2212" : "";
    return f.q === 1 ? `${sign}${Math.abs(f.p)}` : `${sign}${Math.abs(f.p)}/${f.q}`;
  }
  function fmtVertexLabelPlain(a, h, k) {
    const kPrefix = a === 1 ? "" : a === -1 ? "\u2212" : fmtNumPlain(a);
    const hFrac = toSimpleFraction(h);
    const xPart = hFrac.p === 0 ? "x" : hFrac.p > 0 ? `x \u2212 ${fmtNumPlain(h)}` : `x + ${fmtNumPlain(-h)}`;
    const kFrac = toSimpleFraction(k);
    const kPart = kFrac.p === 0 ? "" : kFrac.p > 0 ? ` + ${fmtNumPlain(k)}` : ` \u2212 ${fmtNumPlain(-k)}`;
    return `y = ${kPrefix}(${xPart})\u00b2${kPart}`;
  }

  /* =========================================================
     7. RENDER / DISPLAY
     ========================================================= */
  function displayProblem() {
    exprEl.style.display = "";
    answerWrap.style.display = "none";
    modeLabel.textContent = "หาแกนสมมาตร จุดยอด และจุดตัดแกน x";
  }

  function displayAnswer() {
    exprEl.style.display = "none";
    answerWrap.style.display = "";

    const { a, b, c, h, k, category } = current;
    let roots = null;
    if (category === "two-roots") {
      const disc = b * b - 4 * a * c;
      const sq = Math.sqrt(disc);
      const r1 = (-b - sq) / (2 * a), r2 = (-b + sq) / (2 * a);
      roots = [Math.min(r1, r2), Math.max(r1, r2)];
    } else if (category === "touch") {
      roots = [h];
    }

    graphBox.innerHTML = buildGraph(a, b, c, h, k, roots);
    axisLine.innerHTML = `แกนสมมาตร: x = ${fmtFracHTML(toSimpleFraction(h))}`;
    vertexLine.innerHTML = `จุดยอด: (${fmtFracHTML(toSimpleFraction(h))}, ${fmtFracHTML(toSimpleFraction(k))})`;
    if (category === "two-roots") {
      rootsLine.innerHTML = `จุดตัดแกน x: x = ${fmtFracHTML(toSimpleFraction(roots[0]))}  หรือ  x = ${fmtFracHTML(toSimpleFraction(roots[1]))}`;
    } else if (category === "touch") {
      rootsLine.innerHTML = `จุดตัดแกน x: x = ${fmtFracHTML(toSimpleFraction(roots[0]))}`;
    } else {
      rootsLine.textContent = "จุดตัดแกน x: ไม่ตัดแกน x";
    }
    modeLabel.textContent = "นี่คือเฉลย";
  }

  function showNext() {
    exprEl.classList.add("swap");
    answerWrap.classList.add("swap");
    setTimeout(() => {
      exprEl.innerHTML = newProblem();
      showingAnswer = false;
      displayProblem();
      exprEl.classList.remove("swap");
      answerWrap.classList.remove("swap");
    }, 150);
  }

  function toggleAnswer() {
    const el = showingAnswer ? answerWrap : exprEl;
    el.classList.add("swap");
    setTimeout(() => {
      showingAnswer = !showingAnswer;
      if (showingAnswer) displayAnswer(); else displayProblem();
      (showingAnswer ? answerWrap : exprEl).classList.remove("swap");
    }, 150);
  }

  /* =========================================================
     8. MAIN CONTROLS — EVENTS
     ========================================================= */
  nextBtn.addEventListener("click", showNext);
  toggleBtn.addEventListener("click", toggleAnswer);
  endBtn.addEventListener("click", () => endScreen.classList.add("show"));
  restartBtn.addEventListener("click", () => {
    endScreen.classList.remove("show");
    showNext();
  });

  /* =========================================================
     9. SETTINGS — EVENTS + VALIDATION
     ========================================================= */
  function openSettings() {
    fieldIds.forEach((id) => (document.getElementById(id).value = cfg[id]));
    settingsError.textContent = "";
    settingsOverlay.classList.add("show");
  }

  function closeSettings() {
    settingsOverlay.classList.remove("show");
  }

  gearBtn.addEventListener("click", openSettings);
  cancelBtn.addEventListener("click", closeSettings);
  settingsOverlay.addEventListener("click", (e) => {
    if (e.target === settingsOverlay) closeSettings();
  });

  saveBtn.addEventListener("click", () => {
    const vals = {};
    for (const id of fieldIds) {
      const v = parseInt(document.getElementById(id).value, 10);
      if (!Number.isInteger(v)) {
        settingsError.textContent = "กรอกตัวเลขให้ครบทุกช่อง";
        return;
      }
      vals[id] = v;
    }
    if (vals.aMin >= vals.aMax) { settingsError.textContent = "a: ต่ำสุดต้องน้อยกว่าสูงสุด"; return; }
    if (vals.aMin > 0 || vals.aMax < 0) { settingsError.textContent = "a: ช่วงต้องคร่อม 0"; return; }
    if (vals.bMin >= vals.bMax) { settingsError.textContent = "b: ต่ำสุดต้องน้อยกว่าสูงสุด"; return; }
    if (vals.cMin >= vals.cMax) { settingsError.textContent = "c: ต่ำสุดต้องน้อยกว่าสูงสุด"; return; }

    cfg = { ...cfg, ...vals };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(cfg));
    closeSettings();
    showNext();
  });

  /* =========================================================
     10. INITIAL LOAD
     ========================================================= */
  exprEl.innerHTML = newProblem();
  displayProblem();

</script>

</body>
</html>
