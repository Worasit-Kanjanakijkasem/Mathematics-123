<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>สุ่มโจทย์หา ค.ร.น.</title>
<style>

  /* =========================================================
     1. BASE / VARIABLES
     ========================================================= */
  :root {
    --navy: #2F3C7E;
    --navy-deep: #232D63;
    --coral: #F96167;
    --coral-deep: #E14A50;
    --gold: #F9E795;
    --ink: #FFFFFF;
    --muted: #B9C0E0;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { margin: 0; overflow: hidden; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", "Noto Sans Thai", sans-serif;
    background: var(--navy);
    color: var(--ink);
    height: 100dvh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
    position: relative;
  }

  /* =========================================================
     2. BACKGROUND DECORATION
     ========================================================= */
  .blob { position: absolute; border-radius: 50%; pointer-events: none; }
  .blob-1 { width: 38vmax; height: 38vmax; background: var(--coral); opacity: 0.10; top: -14vmax; right: -12vmax; }
  .blob-2 { width: 26vmax; height: 26vmax; background: var(--gold); opacity: 0.08; bottom: -10vmax; left: -8vmax; }

  /* =========================================================
     3. HEADER (eyebrow) + GEAR BUTTON
     ========================================================= */
  .eyebrow {
    letter-spacing: 0.12em;
    font-size: clamp(13px, 1.6vw, 18px);
    font-weight: 700;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 8px;
    z-index: 1;
  }

  .gear-btn {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    z-index: 2;
    padding: 0;
  }
  .gear-btn:active { background: rgba(255, 255, 255, 0.18); }

  /* =========================================================
     4. STAGE (problem / answer area)
     ---- note: this exercise's answer (a division ladder that
     grows with the number count and their prime factors) can
     genuinely exceed viewport height on short mobile screens,
     so — unlike other exercises — the stage keeps its own
     padding + scroll as a deliberate exception. ----
     ========================================================= */
  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    width: 100%;
    z-index: 1;
    padding: 10px 20px;
    overflow-y: auto;
  }

  .expr {
    font-family: "Cambria", "Georgia", serif;
    font-size: clamp(26px, 5.5vw, 48px);
    font-weight: 700;
    text-align: center;
    line-height: 1.35;
    letter-spacing: 0.05em;
    max-width: 95vw;
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  .expr.swap { opacity: 0; transform: scale(0.95); }

  .answer-wrap { transition: opacity 0.15s ease, transform 0.15s ease; text-align: center; }
  .answer-wrap.swap { opacity: 0; transform: scale(0.95); }

  .mode-label {
    margin-top: 16px;
    font-size: clamp(13px, 1.8vw, 18px);
    color: var(--muted);
    text-align: center;
    z-index: 1;
  }

  /* ---- exercise-specific: short-division ladder ---- */
  .ladder {
    display: inline-block;
    border-collapse: collapse;
    font-family: "Cambria", "Georgia", serif;
    font-size: clamp(18px, 3.4vw, 30px);
    font-weight: 700;
  }
  .ladder tr td { padding: 4px 14px; text-align: center; }
  .ladder .divcol {
    color: var(--coral);
    border-right: 2.5px solid var(--muted);
    padding-right: 12px;
  }

  .final-line {
    font-family: "Cambria", "Georgia", serif;
    font-size: clamp(20px, 4vw, 36px);
    font-weight: 700;
    color: var(--gold);
    margin-top: 16px;
  }

  /* =========================================================
     5. MAIN CONTROLS (next / toggle / end)
     ========================================================= */
  .controls {
    display: flex;
    gap: 14px;
    width: 100%;
    max-width: 760px;
    padding: 8px 24px clamp(12px, 3vh, 30px);
    z-index: 1;
    flex-shrink: 0;
  }

  button {
    border: none;
    border-radius: 20px;
    font-family: inherit;
    font-weight: 700;
    cursor: pointer;
    -webkit-appearance: none;
    transition: transform 0.08s ease, filter 0.15s ease;
  }
  button:active { transform: scale(0.96); }

  .btn-next {
    flex: 2;
    background: var(--coral);
    color: var(--ink);
    font-size: clamp(13px, 2.1vw, 22px);
    padding: clamp(12px, 2.4vh, 20px) 10px;
    white-space: nowrap;
  }

  .btn-toggle {
    flex: 2;
    background: var(--navy-deep);
    color: var(--gold);
    border: 2px solid var(--gold);
    font-size: clamp(13px, 1.9vw, 20px);
    padding: clamp(12px, 2.4vh, 20px) 16px;
  }

  .btn-end {
    flex: 1;
    background: transparent;
    color: var(--muted);
    border: 2px solid var(--navy-deep);
    font-size: clamp(12px, 1.6vw, 18px);
    padding: clamp(12px, 2.4vh, 20px) 12px;
  }
  .btn-end:active { background: var(--navy-deep); }

  /* =========================================================
     6. END SCREEN
     ========================================================= */
  .end-screen {
    position: fixed;
    inset: 0;
    background: var(--navy-deep);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    z-index: 10;
  }
  .end-screen.show { display: flex; }
  .end-screen .headline { font-size: clamp(32px, 6vw, 56px); font-weight: 800; margin-bottom: 12px; }
  .end-screen .sub { color: var(--muted); font-size: clamp(16px, 2.4vw, 22px); margin-bottom: 36px; }

  .btn-restart {
    background: var(--gold);
    color: var(--navy-deep);
    font-size: clamp(17px, 2.4vw, 22px);
    padding: 18px 40px;
    border-radius: 20px;
  }

  /* =========================================================
     7. SETTINGS PANEL
     ========================================================= */
  .settings-overlay {
    position: fixed;
    inset: 0;
    background: rgba(20, 24, 54, 0.75);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 20;
    padding: 20px;
    overflow-y: auto;
  }
  .settings-overlay.show { display: flex; }

  .settings-panel {
    background: var(--navy-deep);
    border-radius: 22px;
    padding: 28px 24px;
    width: 100%;
    max-width: 420px;
    max-height: 92vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4), inset 0 -28px 22px -24px rgba(0, 0, 0, 0.45);
  }
  .settings-panel h2 { margin: 0 0 4px; font-size: 20px; font-weight: 800; }
  .settings-panel .desc { color: var(--muted); font-size: 13px; margin-bottom: 18px; }

  .field-group { margin-bottom: 16px; }
  .field-group .label { font-size: 13px; color: var(--gold); font-weight: 700; margin-bottom: 8px; }
  .field-note { font-size: 11.5px; color: var(--muted); margin-top: 6px; }

  .field-row { display: flex; gap: 10px; align-items: center; }
  .field-row .mini-label { font-size: 12px; color: var(--muted); width: 34px; flex-shrink: 0; }
  .field-row input, .field-row select {
    flex: 1;
    width: 100%;
    min-width: 0;
    font-family: inherit;
    font-size: 17px;
    font-weight: 700;
    color: var(--ink);
    background: rgba(255, 255, 255, 0.08);
    border: 2px solid rgba(255, 255, 255, 0.12);
    border-radius: 10px;
    padding: 10px;
    box-sizing: border-box;
    font-variant-numeric: tabular-nums;
  }
  .field-row select option { color: #000; }
  .field-row input:focus, .field-row select:focus { outline: none; border-color: var(--coral); }

  .settings-error { color: var(--coral); font-size: 13px; font-weight: 700; margin: 4px 0 6px; min-height: 16px; }

  .settings-actions { display: flex; gap: 12px; margin-top: 10px; }
  .btn-cancel { flex: 1; background: transparent; border: 2px solid rgba(255, 255, 255, 0.15); color: var(--muted); font-size: 15px; padding: 14px; }
  .btn-save { flex: 1; background: var(--coral); color: var(--ink); font-size: 15px; padding: 14px; }

  /* =========================================================
     8. RESPONSIVE (short screens)
     ========================================================= */
  @media (max-height: 480px) {
    .settings-panel { padding: 16px 18px; max-height: 94vh; }
    .settings-panel h2 { font-size: 17px; margin-bottom: 2px; }
    .settings-panel .desc { font-size: 11.5px; margin-bottom: 10px; }
    .field-group { margin: 10px 0; }

    .eyebrow { margin-bottom: 4px; }
    .stage { padding: 4px 20px; }
    .ladder { font-size: clamp(13px, 2.6vw, 20px); }
    .ladder tr td { padding: 1px 8px; }
    .ladder .divcol { padding-right: 8px; }
    .final-line { font-size: clamp(14px, 2.8vw, 22px); margin-top: 6px; }
    .mode-label { margin-top: 6px; }
  }

</style>
</head>
<body>

  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <button class="gear-btn" id="gearBtn" aria-label="ตั้งค่า">⚙️</button>

  <div class="eyebrow">สุ่มโจทย์หา ค.ร.น.</div>

  <div class="stage">
    <div class="expr" id="exprEl">…</div>
    <div class="answer-wrap" id="answerWrap" style="display:none;">
      <table class="ladder" id="ladderTable"></table>
      <div class="final-line" id="finalLine"></div>
    </div>
    <div class="mode-label" id="modeLabel">หา ค.ร.น. แล้วกดดูเฉลย</div>
  </div>

  <div class="controls">
    <button class="btn-next" id="nextBtn">สุ่มข้อถัดไป ⚡</button>
    <button class="btn-toggle" id="toggleBtn">โจทย์ / เฉลย</button>
    <button class="btn-end" id="endBtn">จบ</button>
  </div>

  <div class="end-screen" id="endScreen">
    <div class="headline">จบแล้ว สู้ๆ นะ! 🎉</div>
    <div class="sub">ฝึกอีกรอบได้เลยถ้าอยากลองต่อ</div>
    <button class="btn-restart" id="restartBtn">เริ่มใหม่</button>
  </div>

  <div class="settings-overlay" id="settingsOverlay">
    <div class="settings-panel">
      <h2>ตั้งค่าการสุ่มโจทย์</h2>
      <div class="desc">กำหนดจำนวนตัวเลขในโจทย์ และค่ามากที่สุด</div>

      <div class="field-group">
        <div class="label">จำนวนตัวเลขในโจทย์</div>
        <div class="field-row">
          <select id="countMode">
            <option value="random">สุ่ม (2-4 ตัว)</option>
            <option value="2">2 ตัว</option>
            <option value="3">3 ตัว</option>
            <option value="4">4 ตัว</option>
          </select>
        </div>
      </div>

      <div class="field-group">
        <div class="label">ค่ามากที่สุดของแต่ละตัวเลข</div>
        <div class="field-row">
          <input type="number" id="maxVal">
        </div>
        <div class="field-note">ต้องอย่างน้อย 5 (ต้องมีเลขพอสุ่มได้ 4 ตัวไม่ซ้ำกัน)</div>
      </div>

      <div class="settings-error" id="settingsError"></div>

      <div class="settings-actions">
        <button class="btn-cancel" id="cancelBtn">ยกเลิก</button>
        <button class="btn-save" id="saveBtn">บันทึก</button>
      </div>
    </div>
  </div>

<script>

  /* =========================================================
     1. CONFIG
     ========================================================= */
  const DEFAULT_CFG = { countMode: "random", maxVal: 60 };
  const STORAGE_KEY = "lcm-gen-cfg";

  let cfg = { ...DEFAULT_CFG };
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (saved) cfg = { ...DEFAULT_CFG, ...saved };
  } catch (e) {}

  /* =========================================================
     2. DOM REFERENCES
     ========================================================= */
  // stage
  const exprEl = document.getElementById("exprEl");
  const answerWrap = document.getElementById("answerWrap");
  const ladderTable = document.getElementById("ladderTable");
  const finalLine = document.getElementById("finalLine");
  const modeLabel = document.getElementById("modeLabel");

  // main controls
  const nextBtn = document.getElementById("nextBtn");
  const toggleBtn = document.getElementById("toggleBtn");
  const endBtn = document.getElementById("endBtn");
  const endScreen = document.getElementById("endScreen");
  const restartBtn = document.getElementById("restartBtn");

  // settings
  const gearBtn = document.getElementById("gearBtn");
  const settingsOverlay = document.getElementById("settingsOverlay");
  const countModeSelect = document.getElementById("countMode");
  const maxValInput = document.getElementById("maxVal");
  const settingsError = document.getElementById("settingsError");
  const cancelBtn = document.getElementById("cancelBtn");
  const saveBtn = document.getElementById("saveBtn");

  /* =========================================================
     3. STATE
     ========================================================= */
  let current = null;
  let showingAnswer = false;

  /* =========================================================
     4. GENERIC UTILITIES
     ========================================================= */
  function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

  /* =========================================================
     5. DOMAIN LOGIC
     Short-division ("หารสั้น") ladder: repeatedly divide by the
     smallest prime factor common to any remaining number > 1;
     the LCM is the product of every divisor used.
     ========================================================= */
  function smallestPrimeFactor(n) {
    if (n <= 1) return null;
    for (let p = 2; p * p <= n; p++) if (n % p === 0) return p;
    return n;
  }

  function divisionLadder(nums) {
    let row = nums.slice();
    const divisors = [];
    const steps = [row.slice()];
    while (row.some((x) => x > 1)) {
      const candidates = row.filter((x) => x > 1).map(smallestPrimeFactor);
      const p = Math.min(...candidates);
      row = row.map((x) => (x > 1 && x % p === 0 ? x / p : x));
      divisors.push(p);
      steps.push(row.slice());
    }
    const product = divisors.reduce((a, b) => a * b, 1);
    return { divisors, steps, product };
  }

  function genProblem() {
    const n = cfg.countMode === "random" ? randInt(2, 4) : parseInt(cfg.countMode, 10);

    // sample n distinct values from [2, maxVal] without replacement (Fisher-Yates partial shuffle)
    const pool = [];
    for (let v = 2; v <= cfg.maxVal; v++) pool.push(v);
    for (let i = pool.length - 1; i > 0; i--) {
      const j = randInt(0, i);
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    const nums = pool.slice(0, n);

    return { nums };
  }

  function newProblem() {
    current = genProblem();
    return `หา ค.ร.น. ของ ${current.nums.join(", ")}`;
  }

  function buildLadderHTML(nums) {
    const { divisors, steps } = divisionLadder(nums);
    let html = "";
    for (let i = 0; i < steps.length; i++) {
      html += "<tr>";
      html += `<td class="divcol">${i < divisors.length ? divisors[i] : ""}</td>`;
      steps[i].forEach((v) => { html += `<td>${v}</td>`; });
      html += "</tr>";
    }
    return html;
  }

  /* =========================================================
     6. RENDER / DISPLAY
     ========================================================= */
  function displayProblem() {
    exprEl.style.display = "";
    answerWrap.style.display = "none";
    modeLabel.textContent = "หา ค.ร.น. แล้วกดดูเฉลย";
  }

  function displayAnswer() {
    exprEl.style.display = "none";
    answerWrap.style.display = "";
    ladderTable.innerHTML = buildLadderHTML(current.nums);
    const { divisors, product } = divisionLadder(current.nums);
    finalLine.textContent = `ค.ร.น. = ${divisors.join(" \u00d7 ")} = ${product}`;
    modeLabel.textContent = "นี่คือเฉลย (วิธีหารสั้น)";
  }

  function showNext() {
    exprEl.classList.add("swap");
    answerWrap.classList.add("swap");
    setTimeout(() => {
      exprEl.textContent = newProblem();
      showingAnswer = false;
      displayProblem();
      exprEl.classList.remove("swap");
      answerWrap.classList.remove("swap");
    }, 150);
  }

  function toggleAnswer() {
    const el = showingAnswer ? answerWrap : exprEl;
    el.classList.add("swap");
    setTimeout(() => {
      showingAnswer = !showingAnswer;
      if (showingAnswer) displayAnswer(); else displayProblem();
      (showingAnswer ? answerWrap : exprEl).classList.remove("swap");
    }, 150);
  }

  /* =========================================================
     7. MAIN CONTROLS — EVENTS
     ========================================================= */
  nextBtn.addEventListener("click", showNext);
  toggleBtn.addEventListener("click", toggleAnswer);
  endBtn.addEventListener("click", () => endScreen.classList.add("show"));
  restartBtn.addEventListener("click", () => {
    endScreen.classList.remove("show");
    showNext();
  });

  /* =========================================================
     8. SETTINGS — EVENTS + VALIDATION
     ========================================================= */
  function openSettings() {
    countModeSelect.value = cfg.countMode;
    maxValInput.value = cfg.maxVal;
    settingsError.textContent = "";
    settingsOverlay.classList.add("show");
  }

  function closeSettings() {
    settingsOverlay.classList.remove("show");
  }

  gearBtn.addEventListener("click", openSettings);
  cancelBtn.addEventListener("click", closeSettings);
  settingsOverlay.addEventListener("click", (e) => {
    if (e.target === settingsOverlay) closeSettings();
  });

  saveBtn.addEventListener("click", () => {
    const countMode = countModeSelect.value;
    const maxVal = parseInt(maxValInput.value, 10);

    if (!Number.isInteger(maxVal)) {
      settingsError.textContent = "กรอกค่ามากที่สุดให้ถูกต้อง";
      return;
    }
    if (maxVal < 5) {
      settingsError.textContent = "ค่ามากที่สุดต้องอย่างน้อย 5 (ต้องมีเลขพอสุ่มได้ 4 ตัวไม่ซ้ำกัน)";
      return;
    }

    cfg = { ...cfg, countMode, maxVal };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(cfg));
    closeSettings();
    showNext();
  });

  /* =========================================================
     9. INITIAL LOAD
     ========================================================= */
  exprEl.textContent = newProblem();
  displayProblem();

</script>

</body>
</html>
