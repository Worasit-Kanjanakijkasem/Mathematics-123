<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ฝึกหารลงตัว</title>
<style>
  :root {
    --navy: #2F3C7E;
    --navy-deep: #232D63;
    --coral: #F96167;
    --coral-deep: #E14A50;
    --gold: #F9E795;
    --ink: #FFFFFF;
    --muted: #B9C0E0;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", "Noto Sans Thai", sans-serif;
    background: var(--navy);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    user-select: none;
    position: relative;
  }

  /* ambient corner accents, echoing the deck's motif */
  .blob {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
  }
  .blob-1 { width: 38vmax; height: 38vmax; background: var(--coral); opacity: 0.10; top: -14vmax; right: -12vmax; }
  .blob-2 { width: 26vmax; height: 26vmax; background: var(--gold); opacity: 0.08; bottom: -10vmax; left: -8vmax; }

  .eyebrow {
    letter-spacing: 0.12em;
    font-size: clamp(13px, 1.6vw, 18px);
    font-weight: 700;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 8px;
    z-index: 1;
  }

  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    width: 100%;
    z-index: 1;
  }

  .number {
    font-size: clamp(64px, 18vw, 220px);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.01em;
    line-height: 1;
    margin: 0;
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  .number.swap { opacity: 0; transform: scale(0.92); }

  .prompt {
    margin-top: 22px;
    font-size: clamp(16px, 2.4vw, 26px);
    color: var(--muted);
    text-align: center;
    padding: 0 24px;
  }
  .prompt b { color: var(--ink); font-weight: 700; }

  .controls {
    display: flex;
    gap: 18px;
    width: 100%;
    max-width: 720px;
    padding: 0 24px 40px;
    z-index: 1;
  }

  button {
    border: none;
    border-radius: 20px;
    font-family: inherit;
    font-weight: 700;
    cursor: pointer;
    -webkit-appearance: none;
    transition: transform 0.08s ease, filter 0.15s ease;
  }
  button:active { transform: scale(0.96); }

  .btn-next {
    flex: 2;
    background: var(--coral);
    color: var(--ink);
    font-size: clamp(20px, 3vw, 30px);
    padding: 26px 20px;
    box-shadow: 0 8px 0 var(--coral-deep);
  }
  .btn-next:active { box-shadow: 0 3px 0 var(--coral-deep); }

  .btn-end {
    flex: 1;
    background: transparent;
    color: var(--muted);
    border: 2px solid var(--navy-deep);
    font-size: clamp(16px, 2.2vw, 22px);
    padding: 26px 16px;
  }
  .btn-end:active { background: var(--navy-deep); }

  /* end screen */
  .end-screen {
    position: fixed;
    inset: 0;
    background: var(--navy-deep);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    z-index: 10;
  }
  .end-screen.show { display: flex; }
  .end-screen .headline {
    font-size: clamp(32px, 6vw, 56px);
    font-weight: 800;
    margin-bottom: 12px;
  }
  .end-screen .sub {
    color: var(--muted);
    font-size: clamp(16px, 2.4vw, 22px);
    margin-bottom: 36px;
  }
  .btn-restart {
    background: var(--gold);
    color: var(--navy-deep);
    font-size: clamp(18px, 2.6vw, 24px);
    padding: 20px 44px;
    border-radius: 20px;
  }

  @media (prefers-reduced-motion: reduce) {
    .number { transition: none; }
  }
</style>
</head>
<body>

  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="eyebrow">ฝึกหารลงตัว · 3 · 4 · 8 · 9 · 11</div>

  <div class="stage">
    <div class="number" id="number">–</div>
    <div class="prompt">หารลงตัวด้วยตัวไหนบ้าง? <b>(3, 4, 8, 9, 11)</b></div>
  </div>

  <div class="controls">
    <button class="btn-next" id="nextBtn">สุ่มข้อถัดไป ⚡</button>
    <button class="btn-end" id="endBtn">จบ</button>
  </div>

  <div class="end-screen" id="endScreen">
    <div class="headline">จบแล้ว สู้ๆ นะ! 🎉</div>
    <div class="sub">ฝึกอีกรอบได้เลยถ้าอยากลองต่อ</div>
    <button class="btn-restart" id="restartBtn">เริ่มใหม่</button>
  </div>

<script>
  const MIN_NUM = 101;
  const MAX_NUM = 99999;

  const numberEl = document.getElementById('number');
  const nextBtn = document.getElementById('nextBtn');
  const endBtn = document.getElementById('endBtn');
  const endScreen = document.getElementById('endScreen');
  const restartBtn = document.getElementById('restartBtn');

  function randomNumber() {
    return Math.floor(Math.random() * (MAX_NUM - MIN_NUM + 1)) + MIN_NUM;
  }

  function showNext() {
    numberEl.classList.add('swap');
    setTimeout(() => {
      numberEl.textContent = randomNumber().toLocaleString('en-US');
      numberEl.classList.remove('swap');
    }, 150);
  }

  nextBtn.addEventListener('click', showNext);

  endBtn.addEventListener('click', () => {
    endScreen.classList.add('show');
  });

  restartBtn.addEventListener('click', () => {
    endScreen.classList.remove('show');
    showNext();
  });

  // first number on load
  numberEl.textContent = randomNumber().toLocaleString('en-US');
</script>

</body>
</html>
