<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>สุ่มโจทย์คูณพหุนาม</title>
<style>
  :root {
    --navy: #2F3C7E;
    --navy-deep: #232D63;
    --coral: #F96167;
    --coral-deep: #E14A50;
    --gold: #F9E795;
    --ink: #FFFFFF;
    --muted: #B9C0E0;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", "Noto Sans Thai", sans-serif;
    background: var(--navy);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    user-select: none;
    position: relative;
  }
  .blob { position: absolute; border-radius: 50%; pointer-events: none; }
  .blob-1 { width: 38vmax; height: 38vmax; background: var(--coral); opacity: 0.10; top: -14vmax; right: -12vmax; }
  .blob-2 { width: 26vmax; height: 26vmax; background: var(--gold); opacity: 0.08; bottom: -10vmax; left: -8vmax; }

  .eyebrow {
    letter-spacing: 0.1em;
    font-size: clamp(11px, 1.4vw, 16px);
    font-weight: 700;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 8px;
    z-index: 1;
    text-align: center;
    padding: 0 12px;
  }

  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    width: 100%;
    z-index: 1;
    padding: 10px 20px;
    overflow-y: auto;
  }

  .expr {
    font-family: "Cambria", "Georgia", serif;
    font-size: clamp(20px, 4.4vw, 38px);
    font-weight: 700;
    text-align: center;
    line-height: 1.4;
    max-width: 95vw;
    transition: opacity 0.15s ease, transform 0.15s ease;
    word-break: break-word;
  }
  .expr.swap { opacity: 0; transform: scale(0.95); }

  .answer-wrap { transition: opacity 0.15s ease, transform 0.15s ease; text-align: center; max-width: 95vw; }
  .answer-wrap.swap { opacity: 0; transform: scale(0.95); }
  .answer-line {
    font-family: "Cambria", "Georgia", serif;
    font-weight: 700;
    text-align: center;
    line-height: 1.5;
    word-break: break-word;
  }
  .answer-line.final { font-size: clamp(18px, 3.8vw, 32px); color: var(--gold); }

  .mode-label {
    margin-top: 20px;
    font-size: clamp(13px, 1.8vw, 18px);
    color: var(--muted);
    text-align: center;
    z-index: 1;
  }

  .controls {
    display: flex;
    gap: 14px;
    width: 100%;
    max-width: 760px;
    padding: 0 24px clamp(16px, 4vh, 40px);
    z-index: 1;
  }
  button {
    border: none;
    border-radius: 20px;
    font-family: inherit;
    font-weight: 700;
    cursor: pointer;
    -webkit-appearance: none;
    transition: transform 0.08s ease, filter 0.15s ease;
  }
  button:active { transform: scale(0.96); }
  .btn-next {
    flex: 2;
    background: var(--coral);
    color: var(--ink);
    font-size: clamp(15px, 2.2vw, 24px);
    padding: clamp(14px, 2.8vh, 22px) 16px;
    box-shadow: 0 8px 0 var(--coral-deep);
  }
  .btn-next:active { box-shadow: 0 3px 0 var(--coral-deep); }
  .btn-toggle {
    flex: 2;
    background: var(--navy-deep);
    color: var(--gold);
    border: 2px solid var(--gold);
    font-size: clamp(14px, 2vw, 22px);
    padding: clamp(14px, 2.8vh, 22px) 16px;
  }
  .btn-end {
    flex: 1;
    background: transparent;
    color: var(--muted);
    border: 2px solid var(--navy-deep);
    font-size: clamp(13px, 1.7vw, 20px);
    padding: clamp(14px, 2.8vh, 22px) 12px;
  }
  .btn-end:active { background: var(--navy-deep); }

  .end-screen {
    position: fixed; inset: 0; background: var(--navy-deep);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px; z-index: 10;
  }
  .end-screen.show { display: flex; }
  .end-screen .headline { font-size: clamp(28px, 5vw, 52px); font-weight: 800; margin-bottom: 12px; }
  .end-screen .sub { color: var(--muted); font-size: clamp(15px, 2.2vw, 20px); margin-bottom: 32px; }
  .btn-restart { background: var(--gold); color: var(--navy-deep); font-size: clamp(17px, 2.4vw, 22px); padding: 18px 40px; border-radius: 20px; }

  .gear-btn {
    position: absolute; top: 14px; right: 14px; width: 42px; height: 42px; border-radius: 50%;
    background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center;
    font-size: 19px; z-index: 2; padding: 0;
  }
  .gear-btn:active { background: rgba(255,255,255,0.18); }

  .settings-overlay {
    position: fixed; inset: 0; background: rgba(20,24,54,0.75);
    display: none; align-items: center; justify-content: center; z-index: 20; padding: 20px; overflow-y: auto;
  }
  .settings-overlay.show { display: flex; }
  .settings-panel {
    background: var(--navy-deep); border-radius: 22px; padding: 26px 22px; width: 100%; max-width: 420px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4), inset 0 -28px 22px -24px rgba(0,0,0,0.45);
    max-height: 92vh; overflow-y: auto;
  }
  .settings-panel h2 { margin: 0 0 4px; font-size: 19px; font-weight: 800; }
  .settings-panel .desc { color: var(--muted); font-size: 12.5px; margin-bottom: 16px; }
  .field-group { margin-bottom: 14px; }
  .field-group .label { font-size: 13px; color: var(--gold); font-weight: 700; margin-bottom: 7px; }
  .field-row { display: flex; gap: 10px; align-items: center; }
  .field-row input {
    flex: 1; font-family: inherit; font-size: 16px; font-weight: 700; color: var(--ink);
    background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.12); border-radius: 10px;
    padding: 9px 9px; box-sizing: border-box; font-variant-numeric: tabular-nums; width: 100%; min-width: 0;
  }
  .field-row input:focus { outline: none; border-color: var(--coral); }
  .field-note { font-size: 11.5px; color: var(--muted); margin-top: 6px; }
  .settings-error { color: var(--coral); font-size: 13px; font-weight: 700; margin: 4px 0 6px; min-height: 16px; }
  .settings-actions { display: flex; gap: 12px; margin-top: 10px; }
  .btn-cancel { flex: 1; background: transparent; border: 2px solid rgba(255,255,255,0.15); color: var(--muted); font-size: 15px; padding: 14px; }
  .btn-save { flex: 1; background: var(--coral); color: var(--ink); font-size: 15px; padding: 14px; }

  @media (max-height: 480px) {
    .settings-panel { padding: 14px 16px; max-height: 94vh; }
    .field-group { margin-bottom: 8px; }
    .settings-panel h2 { font-size: 16px; margin-bottom: 2px; }
    .settings-panel .desc { font-size: 11px; margin-bottom: 8px; }
  }
</style>
</head>
<body>

  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <button class="gear-btn" id="gearBtn" aria-label="ตั้งค่า">⚙️</button>

  <div class="eyebrow">สุ่มโจทย์คูณพหุนาม</div>

  <div class="stage">
    <div class="expr" id="exprEl">…</div>
    <div class="answer-wrap" id="answerWrap" style="display:none;">
      <div class="answer-line final" id="finalLine"></div>
    </div>
    <div class="mode-label" id="modeLabel">กระจายและรวมพจน์ แล้วกดดูเฉลย</div>
  </div>

  <div class="controls">
    <button class="btn-next" id="nextBtn">สุ่มโจทย์ใหม่ ⚡</button>
    <button class="btn-toggle" id="toggleBtn">โจทย์ / เฉลย</button>
    <button class="btn-end" id="endBtn">จบ</button>
  </div>

  <div class="end-screen" id="endScreen">
    <div class="headline">จบแล้ว สู้ๆ นะ! 🎉</div>
    <div class="sub">ฝึกอีกรอบได้เลยถ้าอยากลองต่อ</div>
    <button class="btn-restart" id="restartBtn">เริ่มใหม่</button>
  </div>

  <div class="settings-overlay" id="settingsOverlay">
    <div class="settings-panel">
      <h2>ตั้งค่าการสุ่มโจทย์</h2>
      <div class="desc">กำหนดค่าสัมประสิทธิ์สูงสุดที่ใช้ในโจทย์</div>

      <div class="field-group">
        <div class="label">สัมประสิทธิ์สูงสุด</div>
        <div class="field-row">
          <input type="number" id="maxCoeff">
        </div>
        <div class="field-note">จำนวนพจน์ต่อวงเล็บ (1-4) และเลขชี้กำลัง (1-4) กำหนดตายตัวตามหลักการของแบบฝึกหัดนี้</div>
      </div>

      <div class="settings-error" id="settingsError"></div>

      <div class="settings-actions">
        <button class="btn-cancel" id="cancelBtn">ยกเลิก</button>
        <button class="btn-save" id="saveBtn">บันทึก</button>
      </div>
    </div>
  </div>

<script>
  const DEFAULT_CFG = { maxCoeff: 9 };
  const STORAGE_KEY = "poly-mult-gen-cfg";
  let cfg = { ...DEFAULT_CFG };
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (saved) cfg = { ...DEFAULT_CFG, ...saved };
  } catch (e) {}

  const GROUPS = [
    ["x", "y"], ["x", "y", "z"],
    ["a", "b"], ["a", "b", "c"], ["a", "b", "c", "d"],
    ["u", "v"], ["u", "v", "w"],
    ["p", "q"], ["p", "q", "r", "s"],
  ];
  const SUP = { 1: "", 2: "\u00b2", 3: "\u00b3", 4: "\u2074", 5: "\u2075", 6: "\u2076", 7: "\u2077", 8: "\u2078" };

  function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
  function choice(arr) { return arr[randInt(0, arr.length - 1)]; }
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = randInt(0, i);[a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }

  function weightedTermCount() {
    // 2 terms most common, then 3, then 4 (45% / 35% / 20%)
    const r = Math.random();
    if (r < 0.45) return 2;
    if (r < 0.80) return 3;
    return 4;
  }

  function generateBracket(group) {
    const k = weightedTermCount(); // at least 2 terms per bracket, weighted toward fewer terms
    const terms = [];
    // weight toward "single shared parameter" brackets (looks like a familiar one-variable polynomial)
    const useSingleParam = Math.random() < 0.55;
    if (useSingleParam) {
      const param = choice(group);
      for (let i = 0; i < k; i++) terms.push({ param });
    } else {
      for (let i = 0; i < k; i++) terms.push({ param: choice(group) });
    }

    const byParam = {};
    terms.forEach((t, idx) => { (byParam[t.param] = byParam[t.param] || []).push(idx); });
    Object.keys(byParam).forEach((p) => {
      const indices = byParam[p];
      if (indices.length === 1) {
        terms[indices[0]].exp = randInt(1, 4);
      } else {
        const pool = shuffle([1, 2, 3, 4]);
        indices.forEach((idx, j) => { terms[idx].exp = pool[j]; });
      }
    });
    terms.forEach((t) => { t.coeff = randInt(1, cfg.maxCoeff); t.sign = choice([1, -1]); });
    return terms;
  }

  function multiplyBrackets(terms1, terms2) {
    const products = [];
    for (const t1 of terms1) {
      for (const t2 of terms2) {
        const coeff = t1.sign * t1.coeff * t2.sign * t2.coeff;
        const factors = {};
        factors[t1.param] = (factors[t1.param] || 0) + t1.exp;
        factors[t2.param] = (factors[t2.param] || 0) + t2.exp;
        products.push({ coeff, factors });
      }
    }
    const combined = {};
    for (const p of products) {
      const sig = Object.keys(p.factors).sort().map((k) => `${k}^${p.factors[k]}`).join("*");
      if (!combined[sig]) combined[sig] = { coeff: 0, factors: p.factors };
      combined[sig].coeff += p.coeff;
    }
    return Object.values(combined).filter((t) => t.coeff !== 0);
  }

  function fmtBracket(terms) {
    return terms.map((t, i) => {
      const signStr = t.sign === 1 ? (i === 0 ? "" : " + ") : (i === 0 ? "\u2212" : " \u2212 ");
      const coeffStr = t.coeff === 1 ? "" : t.coeff;
      const expStr = SUP[t.exp];
      return `${signStr}${coeffStr}${t.param}${expStr}`;
    }).join("");
  }

  function fmtProduct(terms) {
    const sorted = terms.slice().sort((a, b) => {
      const degA = Object.values(a.factors).reduce((s, e) => s + e, 0);
      const degB = Object.values(b.factors).reduce((s, e) => s + e, 0);
      if (degB !== degA) return degB - degA;
      const sigA = Object.keys(a.factors).sort().join("");
      const sigB = Object.keys(b.factors).sort().join("");
      return sigA.localeCompare(sigB);
    });
    return sorted.map((t, i) => {
      const sign = t.coeff < 0 ? (i === 0 ? "\u2212" : " \u2212 ") : (i === 0 ? "" : " + ");
      const absCoeff = Math.abs(t.coeff);
      const coeffStr = absCoeff === 1 ? "" : absCoeff;
      const factorStr = Object.keys(t.factors).sort().map((p) => {
        const e = t.factors[p];
        return `${p}${SUP[e] !== undefined ? SUP[e] : `^${e}`}`;
      }).join("");
      return `${sign}${coeffStr}${factorStr}`;
    }).join("");
  }

  let current = null;
  let showingAnswer = false;

  function newProblem() {
    const group = choice(GROUPS);
    const b1 = generateBracket(group);
    const b2 = generateBracket(group);
    current = { group, b1, b2 };
    return `(${fmtBracket(b1)})(${fmtBracket(b2)})`;
  }

  const exprEl = document.getElementById("exprEl");
  const answerWrap = document.getElementById("answerWrap");
  const finalLine = document.getElementById("finalLine");
  const modeLabel = document.getElementById("modeLabel");
  const nextBtn = document.getElementById("nextBtn");
  const toggleBtn = document.getElementById("toggleBtn");
  const endBtn = document.getElementById("endBtn");
  const endScreen = document.getElementById("endScreen");
  const restartBtn = document.getElementById("restartBtn");

  function displayProblem() {
    exprEl.style.display = "";
    answerWrap.style.display = "none";
    modeLabel.textContent = "กระจายและรวมพจน์ แล้วกดดูเฉลย";
  }
  function displayAnswer() {
    exprEl.style.display = "none";
    answerWrap.style.display = "";
    const product = multiplyBrackets(current.b1, current.b2);
    finalLine.textContent = fmtProduct(product);
    modeLabel.textContent = "นี่คือเฉลย (กระจายและรวมพจน์แล้ว)";
  }

  function showNext() {
    exprEl.classList.add("swap"); answerWrap.classList.add("swap");
    setTimeout(() => {
      exprEl.textContent = newProblem();
      showingAnswer = false;
      displayProblem();
      exprEl.classList.remove("swap"); answerWrap.classList.remove("swap");
    }, 150);
  }
  function toggleAnswer() {
    const el = showingAnswer ? answerWrap : exprEl;
    el.classList.add("swap");
    setTimeout(() => {
      showingAnswer = !showingAnswer;
      if (showingAnswer) displayAnswer(); else displayProblem();
      (showingAnswer ? answerWrap : exprEl).classList.remove("swap");
    }, 150);
  }

  nextBtn.addEventListener("click", showNext);
  toggleBtn.addEventListener("click", toggleAnswer);
  endBtn.addEventListener("click", () => endScreen.classList.add("show"));
  restartBtn.addEventListener("click", () => { endScreen.classList.remove("show"); showNext(); });

  // --- settings ---
  const gearBtn = document.getElementById("gearBtn");
  const settingsOverlay = document.getElementById("settingsOverlay");
  const settingsError = document.getElementById("settingsError");
  const cancelBtn = document.getElementById("cancelBtn");
  const saveBtn = document.getElementById("saveBtn");

  function openSettings() {
    document.getElementById("maxCoeff").value = cfg.maxCoeff;
    settingsError.textContent = "";
    settingsOverlay.classList.add("show");
  }
  function closeSettings() { settingsOverlay.classList.remove("show"); }
  gearBtn.addEventListener("click", openSettings);
  cancelBtn.addEventListener("click", closeSettings);
  settingsOverlay.addEventListener("click", (e) => { if (e.target === settingsOverlay) closeSettings(); });

  saveBtn.addEventListener("click", () => {
    const maxCoeff = parseInt(document.getElementById("maxCoeff").value, 10);
    if (!Number.isInteger(maxCoeff)) { settingsError.textContent = "กรอกตัวเลขให้ถูกต้อง"; return; }
    if (maxCoeff < 1) { settingsError.textContent = "สัมประสิทธิ์สูงสุดต้องอย่างน้อย 1"; return; }

    cfg = { ...cfg, maxCoeff };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(cfg));
    closeSettings();
    showNext();
  });

  // first problem on load
  exprEl.textContent = newProblem();
  displayProblem();
</script>

</body>
</html>
