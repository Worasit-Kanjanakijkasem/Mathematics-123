<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>สัญกรณ์วิทยาศาสตร์</title>
<style>
  :root {
    --navy: #2F3C7E;
    --navy-deep: #232D63;
    --coral: #F96167;
    --coral-deep: #E14A50;
    --gold: #F9E795;
    --ink: #FFFFFF;
    --muted: #B9C0E0;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", "Noto Sans Thai", sans-serif;
    background: var(--navy);
    color: var(--ink);
    height: 100dvh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
    position: relative;
  }
  .blob { position: absolute; border-radius: 50%; pointer-events: none; }
  .blob-1 { width: 38vmax; height: 38vmax; background: var(--coral); opacity: 0.10; top: -14vmax; right: -12vmax; }
  .blob-2 { width: 26vmax; height: 26vmax; background: var(--gold); opacity: 0.08; bottom: -10vmax; left: -8vmax; }

  .eyebrow {
    letter-spacing: 0.12em;
    font-size: clamp(13px, 1.6vw, 18px);
    font-weight: 700;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 8px;
    z-index: 1;
    text-align: center;
    padding: 0 12px;
  }
  .type-badge {
    font-size: clamp(12px, 1.6vw, 15px);
    color: var(--muted);
    margin-bottom: 6px;
    z-index: 1;
  }

  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    width: 100%;
    z-index: 1;
    padding: 10px 20px;
    overflow-y: auto;
  }

  .expr {
    font-family: "Cambria", "Georgia", serif;
    font-size: clamp(22px, 4vw, 40px);
    font-weight: 700;
    text-align: center;
    line-height: 1.6;
    max-width: 95vw;
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  .expr.swap { opacity: 0; transform: scale(0.94); }

  .answer-wrap { transition: opacity 0.15s ease, transform 0.15s ease; text-align: left; max-width: 620px; width: 100%; }
  .answer-wrap.swap { opacity: 0; transform: scale(0.94); }
  .answer-card {
    background: rgba(255,255,255,0.06);
    border: 1.5px solid rgba(249,231,149,0.4);
    border-radius: 16px;
    padding: 18px 22px;
  }
  .answer-row { margin-bottom: 10px; font-size: clamp(13px, 2vw, 16px); line-height: 1.6; }
  .answer-row:last-child { margin-bottom: 0; }
  .answer-row b { color: var(--gold); }
  .answer-final {
    font-family: "Cambria", "Georgia", serif;
    font-size: clamp(24px, 4.6vw, 44px);
    font-weight: 700;
    color: var(--gold);
    text-align: center;
    margin-top: 14px;
  }

  .prompt { margin-top: 18px; font-size: clamp(14px, 2vw, 20px); color: var(--muted); text-align: center; }

  .controls {
    display: flex; gap: 14px; width: 100%; max-width: 760px;
    padding: 8px 24px clamp(12px, 3vh, 30px); z-index: 1; flex-shrink: 0;
  }
  button {
    border: none; border-radius: 20px; font-family: inherit; font-weight: 700; cursor: pointer;
    -webkit-appearance: none; transition: transform 0.08s ease, filter 0.15s ease;
  }
  button:active { transform: scale(0.96); }
  .btn-next { flex: 2; background: var(--coral); color: var(--ink); font-size: clamp(13px, 2.1vw, 22px); padding: clamp(12px, 2.4vh, 20px) 10px; white-space: nowrap; }
  .btn-toggle { flex: 2; background: var(--navy-deep); color: var(--gold); border: 2px solid var(--gold); font-size: clamp(13px, 1.9vw, 20px); padding: clamp(12px, 2.4vh, 20px) 16px; }
  .btn-end { flex: 1; background: transparent; color: var(--muted); border: 2px solid var(--navy-deep); font-size: clamp(12px, 1.6vw, 18px); padding: clamp(12px, 2.4vh, 20px) 12px; }
  .btn-end:active { background: var(--navy-deep); }

  .end-screen {
    position: fixed; inset: 0; background: var(--navy-deep);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px; z-index: 10;
  }
  .end-screen.show { display: flex; }
  .end-screen .headline { font-size: clamp(32px, 6vw, 56px); font-weight: 800; margin-bottom: 12px; }
  .end-screen .sub { color: var(--muted); font-size: clamp(16px, 2.4vw, 22px); margin-bottom: 36px; }
  .btn-restart { background: var(--gold); color: var(--navy-deep); font-size: clamp(17px, 2.4vw, 22px); padding: 18px 40px; border-radius: 20px; }

  .gear-btn {
    position: absolute; top: 14px; right: 14px; width: 42px; height: 42px; border-radius: 50%;
    background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center;
    font-size: 20px; z-index: 2; padding: 0;
  }
  .gear-btn:active { background: rgba(255,255,255,0.18); }

  .settings-overlay {
    position: fixed; inset: 0; background: rgba(20,24,54,0.75);
    display: none; align-items: center; justify-content: center; z-index: 20; padding: 20px; overflow-y: auto;
  }
  .settings-overlay.show { display: flex; }
  .settings-panel {
    background: var(--navy-deep); border-radius: 22px; padding: 28px 24px; width: 100%; max-width: 420px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4), inset 0 -28px 22px -24px rgba(0,0,0,0.45);
    max-height: 92vh; overflow-y: auto;
  }
  .settings-panel h2 { margin: 0 0 4px; font-size: 20px; font-weight: 800; }
  .settings-panel .desc { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
  .field-group { margin-bottom: 16px; }
  .field-group .label { font-size: 13px; color: var(--gold); font-weight: 700; margin-bottom: 8px; }
  .toggle-row {
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(255,255,255,0.06); border-radius: 12px; padding: 10px 14px; margin-bottom: 8px;
  }
  .toggle-row span { font-size: 13.5px; font-weight: 700; }
  .switch { position: relative; width: 44px; height: 24px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider-track { position: absolute; inset: 0; background: rgba(255,255,255,0.2); border-radius: 24px; transition: 0.2s; cursor: pointer; }
  .slider-track:before { content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; background: white; border-radius: 50%; transition: 0.2s; }
  .switch input:checked + .slider-track { background: var(--coral); }
  .switch input:checked + .slider-track:before { transform: translateX(20px); }
  .settings-error { color: var(--coral); font-size: 13px; font-weight: 700; margin: 4px 0 6px; min-height: 16px; }
  .settings-actions { display: flex; gap: 12px; margin-top: 10px; }
  .btn-cancel { flex: 1; background: transparent; border: 2px solid rgba(255,255,255,0.15); color: var(--muted); font-size: 15px; padding: 14px; }
  .btn-save { flex: 1; background: var(--coral); color: var(--ink); font-size: 15px; padding: 14px; }

  @media (max-height: 480px) {
    .settings-panel { padding: 16px 18px; max-height: 94vh; }
    .field-group { margin-bottom: 8px; }
    .answer-row { margin-bottom: 6px; }
  }
</style>
</head>
<body>

  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <button class="gear-btn" id="gearBtn" aria-label="ตั้งค่า">⚙️</button>

  <div class="eyebrow">สัญกรณ์วิทยาศาสตร์</div>
  <div class="type-badge" id="typeBadge"></div>

  <div class="stage">
    <div class="expr" id="exprEl">…</div>
    <div class="answer-wrap" id="answerWrap" style="display:none;">
      <div class="answer-card" id="answerCard"></div>
    </div>
    <div class="prompt" id="promptEl">คำนวณให้อยู่ในรูปสัญกรณ์วิทยาศาสตร์ แล้วกดดูเฉลย</div>
  </div>

  <div class="controls">
    <button class="btn-next" id="nextBtn">สุ่มข้อถัดไป ⚡</button>
    <button class="btn-toggle" id="toggleBtn">โจทย์ / เฉลย</button>
    <button class="btn-end" id="endBtn">จบ</button>
  </div>

  <div class="end-screen" id="endScreen">
    <div class="headline">จบแล้ว สู้ๆ นะ! 🎉</div>
    <div class="sub">ฝึกอีกรอบได้เลยถ้าอยากลองต่อ</div>
    <button class="btn-restart" id="restartBtn">เริ่มใหม่</button>
  </div>

  <div class="settings-overlay" id="settingsOverlay">
    <div class="settings-panel">
      <h2>ตั้งค่าการสุ่มโจทย์</h2>
      <div class="desc">เลือกประเภทโจทย์ที่ต้องการฝึก (เปิดได้มากกว่า 1 แบบ)</div>

      <div class="toggle-row">
        <span>1. บวก/ลบ (เลขชี้กำลังต่างกัน)</span>
        <label class="switch"><input type="checkbox" id="enableAddSub" checked><span class="slider-track"></span></label>
      </div>
      <div class="toggle-row">
        <span>2. คูณ/หาร (อย่างน้อย 3 พจน์)</span>
        <label class="switch"><input type="checkbox" id="enableMulDiv" checked><span class="slider-track"></span></label>
      </div>

      <div class="settings-error" id="settingsError"></div>

      <div class="settings-actions">
        <button class="btn-cancel" id="cancelBtn">ยกเลิก</button>
        <button class="btn-save" id="saveBtn">บันทึก</button>
      </div>
    </div>
  </div>

<script>
  /* =========================================================
     1. CONFIG
     ========================================================= */
  const DEFAULT_CFG = { enableAddSub: true, enableMulDiv: true };
  const STORAGE_KEY = "sci-notation-cfg";
  let cfg = { ...DEFAULT_CFG };
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (saved) cfg = { ...DEFAULT_CFG, ...saved };
  } catch (e) {}

  function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
  function choice(arr) { return arr[randInt(0, arr.length - 1)]; }

  /* =========================================================
     2. TYPE 1 — ADDITION / SUBTRACTION
     Terms all share an exponent "family" (spread <= 2 orders),
     either all-positive or all-negative (verified beforehand:
     mixing signs within one problem is mathematically impossible
     once 0 and 1 are excluded and the spread is capped at 2), and
     no term may use exponent 0 or 1. Every term's coefficient is
     tracked as an exact integer "digits" (= A*10, so 10-99) to
     keep all arithmetic exact (no floating-point drift) right up
     until the final normalized answer is produced.
     ========================================================= */
  function genAddSub() {
    const signGroup = choice(["pos", "neg"]);
    const nMin = signGroup === "pos" ? randInt(2, 7) : randInt(-9, -2);
    // cap the spread so nMax never crosses into the forbidden 0/1 zone (only an issue
    // when nMin=-2, since spread=2 would otherwise reach nMax=0)
    const maxSpread = (signGroup === "neg" && nMin === -2) ? 1 : 2;
    const spread = randInt(0, maxSpread);
    const nMax = nMin + spread;
    const numTerms = randInt(2, 4);
    const terms = [];
    for (let i = 0; i < numTerms; i++) {
      const n_i = randInt(nMin, nMax);
      const digits = randInt(10, 99); // represents A_i*10 exactly
      const sign = i === 0 ? 1 : (Math.random() < 0.6 ? 1 : -1);
      terms.push({ sign, digits, n: n_i });
    }
    // aligned integer sum (relative to 10^(nMin-1))
    let alignedSum = 0;
    for (const t of terms) alignedSum += t.sign * t.digits * Math.pow(10, t.n - nMin);
    if (alignedSum === 0) return genAddSub(); // reroll the rare all-cancel case
    const neg = alignedSum < 0;
    const absSum = Math.abs(alignedSum);
    const digitsCount = String(absSum).length;
    const shift = digitsCount - 1;
    const finalExp = nMin - 1 + shift;
    return { type: "addsub", nMin, terms, alignedSum, neg, absSum, shift, finalExp };
  }

  /* =========================================================
     3. TYPE 2 — MULTIPLICATION / DIVISION
     At least 3 terms, exponent n unrestricted (0 and 1 are fine
     here since multiplying/dividing powers never creates the
     "trivial alignment" issue that addition has). Coefficients
     are combined as an EXACT fraction (digits_i/10 each) so the
     resulting exponent is always exactly right; only the final
     coefficient is rounded for display, since dividing by an
     arbitrary 1-decimal number can produce a non-terminating
     decimal in general.
     ========================================================= */
  function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); return b === 0 ? a : gcd(b, a % b); }

  function genMulDiv() {
    for (let tries = 0; tries < 300; tries++) {
      const numTerms = randInt(3, 4);
      const terms = [];
      for (let i = 0; i < numTerms; i++) {
        const n_i = randInt(-9, 9);
        const digits = randInt(10, 99);
        const op = i === 0 ? "*" : choice(["*", "/"]);
        terms.push({ op, digits, n: n_i });
      }
      // combine coefficient as exact fraction num/den (each term contributes digits/10)
      let num = 1, den = 1, expSum = 0;
      for (const t of terms) {
        if (t.op === "*") { num *= t.digits; den *= 10; expSum += t.n; }
        else { num *= 10; den *= t.digits; expSum -= t.n; }
      }
      const g = gcd(num, den) || 1;
      num /= g; den /= g;
      const coeffVal = num / den;
      if (coeffVal >= 1 && coeffVal < 10) continue; // must NOT already be normalized (retry)
      // normalize: find shift such that 1 <= coeffVal/10^shift < 10
      const shift = Math.floor(Math.log10(coeffVal));
      const finalExp = expSum + shift;
      const finalCoeff = coeffVal / Math.pow(10, shift);
      return { type: "muldiv", terms, num, den, coeffVal, finalCoeff, finalExp };
    }
    return genMulDiv(); // extremely unlikely fallback
  }

  /* =========================================================
     4. FORMATTING
     ========================================================= */
  function fmtSciTerm(sign, digits, n, isFirst) {
    const A = (digits / 10).toFixed(1).replace(/\.0$/, ""); // drop trailing .0 for whole numbers like 5.0->5
    const signStr = sign > 0 ? (isFirst ? "" : " + ") : (isFirst ? "\u2212" : " \u2212 ");
    return `${signStr}${A}\u00d710<sup>${n}</sup>`;
  }
  function fmtSciTermPlain(A, n) {
    const Astr = (Math.round(A * 100) / 100).toString();
    return `${Astr}\u00d710<sup>${n}</sup>`;
  }

  function fmtProblem(prob) {
    if (prob.type === "addsub") {
      return prob.terms.map((t, i) => fmtSciTerm(t.sign, t.digits, t.n, i === 0)).join("");
    } else {
      return prob.terms.map((t, i) => {
        const A = (t.digits / 10).toFixed(1).replace(/\.0$/, "");
        const opStr = i === 0 ? "" : (t.op === "*" ? " \u00d7 " : " \u00f7 ");
        return `${opStr}${A}\u00d710<sup>${t.n}</sup>`;
      }).join("");
    }
  }

  function fmtAddSubAnswer(prob) {
    const alignedTerms = prob.terms.map(t => {
      const shiftPow = t.n - prob.nMin;
      const alignedVal = t.digits * Math.pow(10, shiftPow);
      return `${t.sign > 0 ? "+" : "\u2212"}${alignedVal}`;
    }).join(" ");
    const A = prob.absSum / Math.pow(10, prob.shift);
    const Astr = (Math.round(A * 1000) / 1000).toString();
    return `
      <div class="answer-row"><b>ขั้นที่ 1 — ปรับทุกพจน์ให้เป็นเลขชี้กำลัง 10<sup>${prob.nMin}</sup> (ค่าน้อยสุด) แล้วดึงตัวร่วมออก:</b></div>
      <div class="answer-row">(${alignedTerms}) \u00d7 10<sup>${prob.nMin}</sup> = ${prob.neg ? "\u2212" : ""}${prob.absSum} \u00d7 10<sup>${prob.nMin}</sup></div>
      <div class="answer-row"><b>ขั้นที่ 2 — ปรับให้ 1 \u2264 A &lt; 10:</b></div>
      <div class="answer-final">${prob.neg ? "\u2212" : ""}${Astr} \u00d7 10<sup>${prob.finalExp}</sup></div>
    `;
  }

  function fmtMulDivAnswer(prob) {
    const Astr = (Math.round(prob.finalCoeff * 1000) / 1000).toString();
    return `<div class="answer-final">${Astr} \u00d7 10<sup>${prob.finalExp}</sup></div>`;
  }

  /* =========================================================
     5. MAIN GENERATOR + DISPLAY
     ========================================================= */
  function generateProblem() {
    const options = [];
    if (cfg.enableAddSub) options.push("addsub");
    if (cfg.enableMulDiv) options.push("muldiv");
    if (!options.length) options.push("addsub"); // safety net
    const kind = choice(options);
    return kind === "addsub" ? genAddSub() : genMulDiv();
  }

  const TYPE_LABELS = { addsub: "แบบที่ 1: บวก/ลบ (เลขชี้กำลังต่างกัน)", muldiv: "แบบที่ 2: คูณ/หาร" };

  const typeBadge = document.getElementById("typeBadge");
  const exprEl = document.getElementById("exprEl");
  const answerWrap = document.getElementById("answerWrap");
  const answerCard = document.getElementById("answerCard");
  const promptEl = document.getElementById("promptEl");
  const nextBtn = document.getElementById("nextBtn");
  const toggleBtn = document.getElementById("toggleBtn");
  const endBtn = document.getElementById("endBtn");
  const endScreen = document.getElementById("endScreen");
  const restartBtn = document.getElementById("restartBtn");
  const gearBtn = document.getElementById("gearBtn");
  const settingsOverlay = document.getElementById("settingsOverlay");
  const settingsError = document.getElementById("settingsError");
  const cancelBtn = document.getElementById("cancelBtn");
  const saveBtn = document.getElementById("saveBtn");
  const enableAddSub = document.getElementById("enableAddSub");
  const enableMulDiv = document.getElementById("enableMulDiv");

  let current = null;

  function displayProblem() {
    exprEl.style.display = "";
    answerWrap.style.display = "none";
    promptEl.textContent = "คำนวณให้อยู่ในรูปสัญกรณ์วิทยาศาสตร์ แล้วกดดูเฉลย";
  }
  function displayAnswer() {
    exprEl.style.display = "none";
    answerWrap.style.display = "";
    answerCard.innerHTML = current.type === "addsub" ? fmtAddSubAnswer(current) : fmtMulDivAnswer(current);
    promptEl.textContent = "นี่คือเฉลย";
  }
  function showNext() {
    exprEl.classList.add("swap"); answerWrap.classList.add("swap");
    setTimeout(() => {
      current = generateProblem();
      typeBadge.textContent = TYPE_LABELS[current.type];
      exprEl.innerHTML = fmtProblem(current);
      displayProblem();
      exprEl.classList.remove("swap"); answerWrap.classList.remove("swap");
    }, 150);
  }
  let showingAnswer = false;
  function toggleAnswer() {
    const el = showingAnswer ? answerWrap : exprEl;
    el.classList.add("swap");
    setTimeout(() => {
      showingAnswer = !showingAnswer;
      if (showingAnswer) displayAnswer(); else displayProblem();
      (showingAnswer ? answerWrap : exprEl).classList.remove("swap");
    }, 150);
  }

  nextBtn.addEventListener("click", () => { showingAnswer = false; showNext(); });
  toggleBtn.addEventListener("click", toggleAnswer);
  endBtn.addEventListener("click", () => endScreen.classList.add("show"));
  restartBtn.addEventListener("click", () => { endScreen.classList.remove("show"); showingAnswer = false; showNext(); });

  function openSettings() {
    enableAddSub.checked = cfg.enableAddSub;
    enableMulDiv.checked = cfg.enableMulDiv;
    settingsError.textContent = "";
    settingsOverlay.classList.add("show");
  }
  function closeSettings() { settingsOverlay.classList.remove("show"); }
  gearBtn.addEventListener("click", openSettings);
  cancelBtn.addEventListener("click", closeSettings);
  settingsOverlay.addEventListener("click", (e) => { if (e.target === settingsOverlay) closeSettings(); });
  saveBtn.addEventListener("click", () => {
    if (!enableAddSub.checked && !enableMulDiv.checked) {
      settingsError.textContent = "ต้องเปิดอย่างน้อย 1 แบบ";
      return;
    }
    cfg = { enableAddSub: enableAddSub.checked, enableMulDiv: enableMulDiv.checked };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(cfg));
    closeSettings();
    showingAnswer = false; showNext();
  });

  current = generateProblem();
  typeBadge.textContent = TYPE_LABELS[current.type];
  exprEl.innerHTML = fmtProblem(current);
  displayProblem();
</script>
</body>
</html>
